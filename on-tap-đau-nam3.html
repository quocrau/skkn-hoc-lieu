<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHẦN 3: PHÉP NHÂN, PHÉP CHIA & GIẢI TOÁN</title>
    <style>
        :root { --primary: #e67e22; --secondary: #f39c12; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .game-card { background: white; border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.2); width: 100%; max-width: 800px; padding: 25px; text-align: center; }
        .header { background: #e67e22; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .q-title { font-size: 1.2rem; margin-bottom: 20px; text-align: left; color: #333; font-weight: 600; line-height: 1.5; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        @media(max-width: 600px){ .btn-grid { grid-template-columns: 1fr; } }
        .opt-btn { background: #f8f9fa; border: 2px solid #dee2e6; border-radius: 12px; padding: 14px; text-align: left; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .opt-btn:hover { background: #fff5eb; border-color: #e67e22; }
        .opt-btn.correct { background: #d4edda !important; border-color: #28a745 !important; color: #155724; font-weight: bold; }
        .opt-btn.incorrect { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }
        .next-btn, .start-btn { background: #e67e22; color: white; border: none; padding: 12px 30px; font-size: 1.1rem; border-radius: 30px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .feedback { margin: 15px 0; padding: 12px; border-radius: 8px; font-weight: 500; text-align: left; display: none; }
        .feedback.correct { background: #d4edda; color: #155724; display: block; }
        .feedback.incorrect { background: #f8d7da; color: #721c24; display: block; }
    </style>
</head>
<body>
<div class="game-card">
    <div class="header">
        <span>✖️➗ PHẦN 3: PHÉP NHÂN, PHÉP CHIA & GIẢI TOÁN</span>
        <span>Điểm: <span id="score">0</span>/50</span>
    </div>
    <div id="quiz-area">
        <div class="q-title" id="q-text"></div>
        <div class="btn-grid" id="opts"></div>
        <div class="feedback" id="fb"></div>
        <button class="next-btn" id="next-btn" style="display:none;" onclick="nextQ()">Câu tiếp theo ➔</button>
    </div>
    <div id="result-area" style="display:none;">
        <h2>HOÀN THÀNH PHẦN 3! 🎉</h2>
        <p style="font-size:1.3rem; margin:20px 0;">Số điểm của em: <strong id="final-score" style="color:#e67e22;">0</strong> / 50</p>
        <button class="start-btn" onclick="location.reload()">Làm lại bài</button>
    </div>
</div>
<script>
const data = [
    { q: "1. Những phép tính nào có cùng kết quả với phép tính 80 000 : 2 (bằng 40 000)?", opts: ["5 000 x 8", "6 000 x 4", "20 000 x 2", "Cả A và C đều đúng"], c: 3, exp: "5 000 x 8 = 40 000 và 20 000 x 2 = 40 000. Do đó cả A và C đều đúng." },
    { q: "2. Tích của 29 073 và 3 là:", opts: ["87 219", "87 019", "31 678", "87 291"], c: 0, exp: "29 073 x 3 = 87 219." },
    { q: "3. Tích của 17 218 x 4 là:", opts: ["68 872", "68 862", "68 772", "68 882"], c: 0, exp: "17 218 x 4 = 68 872." },
    { q: "4. Tính giá trị biểu thức: 13 206 x (36 : 9) =", opts: ["52 824", "42 824", "52 814", "52 924"], c: 0, exp: "Trong ngoặc trước: 36 : 9 = 4. Lấy 13 206 x 4 = 52 824." },
    { q: "5. Ở một nhà máy sản xuất đồ chơi, tháng 1 làm được 12 960 sản phẩm. Tháng 2 giảm 2 lần so với tháng 1. Hỏi tháng 2 làm được bao nhiêu sản phẩm?", opts: ["6 480 sản phẩm", "25 920 sản phẩm", "6 400 sản phẩm", "6 485 sản phẩm"], c: 0, exp: "Tháng 2 làm được: 12 960 : 2 = 6 480 sản phẩm." }
];
let idx = 0, score = 0;
function loadQ() {
    const item = data[idx];
    document.getElementById('q-text').innerText = item.q;
    const optsDiv = document.getElementById('opts');
    optsDiv.innerHTML = '';
    document.getElementById('fb').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    item.opts.forEach((o, i) => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.innerHTML = `<b>${String.fromCharCode(65+i)}.</b> ${o}`;
        b.onclick = () => check(i, b);
        optsDiv.appendChild(b);
    });
}
function check(i, btn) {
    const item = data[idx];
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(b => b.style.pointerEvents = 'none');
    const fb = document.getElementById('fb');
    if(i === item.c) {
        btn.classList.add('correct');
        score += 10;
        document.getElementById('score').innerText = score;
        fb.className = 'feedback correct';
        fb.innerHTML = '✨ <b>Chính xác!</b> ' + item.exp;
    } else {
        btn.classList.add('incorrect');
        btns[item.c].classList.add('correct');
        fb.className = 'feedback incorrect';
        fb.innerHTML = '❌ <b>Chưa đúng!</b> ' + item.exp;
    }
    document.getElementById('next-btn').style.display = 'inline-block';
}
function nextQ() {
    idx++;
    if(idx < data.length) loadQ();
    else {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('final-score').innerText = score;
    }
}
loadQ();
</script>
</body>
</html>
