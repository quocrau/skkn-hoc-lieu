<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Không Gian Phân Số - Phép Nhân & Chia</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --header-gradient: linear-gradient(90deg, #3b82f6, #8b5cf6);
            --primary-blue: #3b82f6;
            --text-light: #f0f6fc;
            --text-muted: #8b949e;
            --fraction1-color: #ff4d6d;
            --fraction2-color: #3b82f6;
            --result-color: #10b981;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            background-image: radial-gradient(circle at 15% 50%, rgba(255, 255, 255, 0.08) 1px, transparent 1px), radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 100px 100px;
        }

        /* Header Styles */
        .header {
            background: var(--header-gradient);
            text-align: center;
            padding: 20px 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .school-badge {
            background-color: #fbbf24;
            color: #000;
            padding: 5px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header p {
            margin: 5px 0 0;
            font-style: italic;
            opacity: 0.9;
        }

        /* Main Content */
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background-color: var(--panel-bg);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
        }

        .icons {
            text-align: center;
            font-size: 2.5rem;
            margin-top: -45px;
            margin-bottom: 20px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background-color: transparent;
            color: var(--text-light);
            border: 1px solid #30363d;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            background-color: #21262d;
        }

        .tab-btn.active {
            background-color: var(--primary-blue);
            border-color: var(--primary-blue);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        /* Workspace */
        .workspace {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .fraction-card {
            flex: 1;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .fraction-card h3 {
            margin-top: 0;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 1rem;
        }

        /* Visual Pie Chart */
        .pie-chart {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: #21262d;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .operator {
            font-size: 3rem;
            color: #fbbf24;
            font-weight: bold;
        }

        /* Inputs */
        .fraction-input {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .fraction-input input {
            width: 60px;
            text-align: center;
            background: #21262d;
            border: 1px solid #30363d;
            color: white;
            font-size: 1.5rem;
            padding: 5px;
            border-radius: 5px;
        }

        .fraction-input input:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        .fraction-line {
            width: 80px;
            height: 3px;
            background-color: var(--text-muted);
        }

        /* Result Area */
        .result-card {
            flex: 1.2;
            background-color: rgba(16, 185, 129, 0.1);
            border-color: var(--result-color);
        }

        .result-card h3 {
            color: var(--result-color);
        }

        .explanation {
            margin-top: 20px;
            padding: 15px;
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid var(--primary-blue);
            border-radius: 0 8px 8px 0;
            font-size: 1.1rem;
            line-height: 1.5;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="school-badge">TRƯỜNG TIỂU HỌC MINH HÒA</div>
        <h1>TRẠM KHÔNG GIAN PHÂN SỐ</h1>
        <p>Học liệu khám phá quy luật toán học - Dành cho Học sinh Khối 4</p>
    </div>

    <div class="container">
        <div class="icons">👦 🚀 🛸</div>
        
        <div class="tabs">
            <button class="tab-btn" onclick="setOperation('multiply')" id="tab-multiply">Phép Nhân (x)</button>
            <button class="tab-btn" onclick="setOperation('divide')" id="tab-divide">Phép Chia (:)</button>
        </div>

        <div class="workspace">
            <div class="fraction-card">
                <h3>Phân số 1</h3>
                <div class="pie-chart" id="pie1"></div>
                <div class="fraction-input">
                    <input type="number" id="num1" value="1" min="0" oninput="calculate()">
                    <div class="fraction-line"></div>
                    <input type="number" id="den1" value="2" min="1" oninput="calculate()">
                </div>
            </div>

            <div class="operator" id="operator-sign">x</div>

            <div class="fraction-card">
                <h3>Phân số 2</h3>
                <div class="pie-chart" id="pie2"></div>
                <div class="fraction-input">
                    <input type="number" id="num2" value="3" min="0" oninput="calculate()">
                    <div class="fraction-line"></div>
                    <input type="number" id="den2" value="4" min="1" oninput="calculate()">
                </div>
            </div>

            <div class="operator">=</div>

            <div class="fraction-card result-card">
                <h3>Kết quả</h3>
                <div class="pie-chart" id="pie-result"></div>
                <div class="fraction-input">
                    <input type="number" id="num-res" readonly>
                    <div class="fraction-line"></div>
                    <input type="number" id="den-res" readonly>
                </div>
            </div>
        </div>

        <div class="explanation" id="explanation-text">
            Mẹo: Muốn nhân hai phân số, ta lấy tử số nhân với tử số, mẫu số nhân với mẫu số.
        </div>
    </div>

    <script>
        let currentOp = 'multiply';

        // Hàm tìm Ước chung lớn nhất (UCLN) để rút gọn phân số
        function gcd(a, b) {
            return b === 0 ? a : gcd(b, a % b);
        }

        // Đổi Tab phép tính
        function setOperation(op) {
            currentOp = op;
            document.getElementById('tab-multiply').classList.remove('active');
            document.getElementById('tab-divide').classList.remove('active');
            
            if(op === 'multiply') {
                document.getElementById('tab-multiply').classList.add('active');
                document.getElementById('operator-sign').innerText = 'x';
            } else {
                document.getElementById('tab-divide').classList.add('active');
                document.getElementById('operator-sign').innerText = ':';
            }
            calculate();
        }

        // Cập nhật biểu đồ tròn
        function updatePie(elementId, num, den, color) {
            const el = document.getElementById(elementId);
            if(den == 0 || num > den) {
                el.style.background = '#21262d'; // Reset nếu lỗi hoặc tử > mẫu
                return;
            }
            const percentage = (num / den) * 100;
            el.style.background = `conic-gradient(${color} ${percentage}%, #21262d 0)`;
        }

        // Tính toán chính
        function calculate() {
            let n1 = parseInt(document.getElementById('num1').value) || 0;
            let d1 = parseInt(document.getElementById('den1').value) || 1;
            let n2 = parseInt(document.getElementById('num2').value) || 0;
            let d2 = parseInt(document.getElementById('den2').value) || 1;

            if(d1 === 0) d1 = 1;
            if(d2 === 0) d2 = 1;

            // Cập nhật hình ảnh 2 phân số đầu
            updatePie('pie1', n1, d1, 'var(--fraction1-color)');
            updatePie('pie2', n2, d2, 'var(--fraction2-color)');

            let resNum = 0;
            let resDen = 1;
            let explanation = '';

            if (currentOp === 'multiply') {
                resNum = n1 * n2;
                resDen = d1 * d2;
                explanation = `<strong>Cách tính:</strong> Lấy tử số nhân tử số (${n1} x ${n2} = ${resNum}), mẫu số nhân mẫu số (${d1} x ${d2} = ${resDen}).`;
            } else if (currentOp === 'divide') {
                resNum = n1 * d2;
                resDen = d1 * n2;
                explanation = `<strong>Cách tính:</strong> Giữ nguyên phân số thứ nhất, nhân với phân số thứ hai đảo ngược. Lấy ${n1} x ${d2} = ${resNum} và ${d1} x ${n2} = ${resDen}.`;
            }

            // Xử lý mẫu số bằng 0 ở kết quả (nếu chia cho 0)
            if(resDen === 0) {
                document.getElementById('num-res').value = "Lỗi";
                document.getElementById('den-res').value = "Lỗi";
                document.getElementById('explanation-text').innerHTML = "Không thể chia cho 0!";
                updatePie('pie-result', 0, 1, 'var(--result-color)');
                return;
            }

            // Rút gọn phân số kết quả
            let divisor = gcd(resNum, resDen);
            let simplifiedNum = resNum / divisor;
            let simplifiedDen = resDen / divisor;

            if(divisor > 1) {
                explanation += `<br><em>Rút gọn kết quả: Chia cả tử và mẫu cho ${divisor}, ta được ${simplifiedNum}/${simplifiedDen}.</em>`;
            }

            // Hiển thị kết quả
            document.getElementById('num-res').value = simplifiedNum;
            document.getElementById('den-res').value = simplifiedDen;
            document.getElementById('explanation-text').innerHTML = explanation;

            // Cập nhật hình ảnh phân số kết quả
            updatePie('pie-result', simplifiedNum, simplifiedDen, 'var(--result-color)');
        }

        // Khởi tạo mặc định
        setOperation('multiply');
    </script>
</body>
</html>
