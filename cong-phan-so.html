<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò Chơi: Thử Tài Cộng Phân Số</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', Arial, sans-serif;
            background-color: #e0f7fa;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #00838f;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .school-badge {
            font-size: 1.2rem;
            color: #00695c;
            background-color: #b2dfdb;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .game-board {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* Styling for fractions */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            font-size: 24px;
            font-weight: bold;
            margin: 0 10px;
            line-height: 1.2;
        }

        .fraction span:first-child {
            border-bottom: 3px solid #333;
            padding: 0 5px;
        }

        .fraction span:last-child {
            padding: 0 5px;
        }

        /* Equation layout */
        .equation-row {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            background-color: #fff9c4;
            padding: 15px 30px;
            border-radius: 15px;
            border: 3px solid #fbc02d;
            width: 100%;
            box-sizing: border-box;
        }

        .math-sign {
            margin: 0 15px;
            color: #d32f2f;
        }

        /* Drop Zone */
        .drop-zone {
            width: 80px;
            height: 80px;
            background-color: #f5f5f5;
            border: 3px dashed #9e9e9e;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 15px;
            transition: all 0.3s;
        }

        .drop-zone.hover {
            background-color: #c8e6c9;
            border-color: #4caf50;
            transform: scale(1.05);
        }

        .drop-zone.correct {
            background-color: #e8f5e9;
            border: 3px solid #4caf50;
        }

        /* Draggable answers container */
        .answers-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 3px dashed #b2ebf2;
            width: 100%;
        }

        /* Draggable cards */
        .drag-card {
            width: 70px;
            height: 70px;
            background-color: #4fc3f7;
            border: 3px solid #0288d1;
            border-radius: 10px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            box-shadow: 2px 4px 0px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .drag-card .fraction span:first-child {
            border-bottom: 3px solid white;
        }

        .drag-card:active {
            cursor: grabbing;
            transform: scale(0.9);
            box-shadow: 1px 2px 0px rgba(0,0,0,0.2);
        }

        .drag-card.used {
            opacity: 0;
            pointer-events: none;
        }

        /* Feedback Message */
        .message {
            margin-top: 20px;
            font-size: 26px;
            font-weight: bold;
            height: 40px;
        }
    </style>
</head>
<body>

    <h1>Phép Cộng Phân Số</h1>
    <div class="school-badge">Học sinh Trường Tiểu Học Minh Hoà trổ tài!</div>
    <p style="font-size: 1.2rem; margin-bottom: 30px;">Kéo đáp án đúng ở dưới thả vào ô trống để hoàn thành phép tính nhé.</p>

    <div class="game-board">
        <div class="equation-row">
            <div class="fraction"><span>1</span><span>5</span></div>
            <span class="math-sign">+</span>
            <div class="fraction"><span>2</span><span>5</span></div>
            <span class="math-sign">=</span>
            <div class="drop-zone" data-answer="3/5">?</div>
        </div>

        <div class="equation-row">
            <div class="fraction"><span>4</span><span>11</span></div>
            <span class="math-sign">+</span>
            <div class="fraction"><span>2</span><span>11</span></div>
            <span class="math-sign">=</span>
            <div class="drop-zone" data-answer="6/11">?</div>
        </div>

        <div class="equation-row">
            <div class="fraction"><span>3</span><span>8</span></div>
            <span class="math-sign">+</span>
            <div class="fraction"><span>3</span><span>8</span></div>
            <span class="math-sign">=</span>
            <div class="drop-zone" data-answer="6/8">?</div>
        </div>

        <div class="answers-container">
            <div class="drag-card" draggable="true" data-val="3/5" id="card1">
                <div class="fraction"><span>3</span><span>5</span></div>
            </div>
            <div class="drag-card" draggable="true" data-val="6/11" id="card2">
                <div class="fraction"><span>6</span><span>11</span></div>
            </div>
            <div class="drag-card" draggable="true" data-val="6/8" id="card3">
                <div class="fraction"><span>6</span><span>8</span></div>
            </div>
            
            <div class="drag-card" draggable="true" data-val="trap1" id="card4" style="background-color: #ffb74d; border-color: #f57c00;">
                <div class="fraction"><span>3</span><span>10</span></div>
            </div>
            <div class="drag-card" draggable="true" data-val="trap2" id="card5" style="background-color: #ffb74d; border-color: #f57c00;">
                <div class="fraction"><span>6</span><span>22</span></div>
            </div>
        </div>
    </div>

    <div class="message" id="message"></div>

    <script>
        const cards = document.querySelectorAll('.drag-card');
        const dropZones = document.querySelectorAll('.drop-zone');
        const messageDisplay = document.getElementById('message');
        let correctAnswers = 0;

        // Xử lý kéo thẻ
        cards.forEach(card => {
            card.addEventListener('dragstart', e => {
                e.dataTransfer.setData('value', card.dataset.val);
                e.dataTransfer.setData('id', card.id);
                setTimeout(() => card.style.opacity = '0.4', 0);
            });

            card.addEventListener('dragend', () => {
                card.style.opacity = '1';
            });
        });

        // Xử lý thả thẻ vào ô
        dropZones.forEach(zone => {
            zone.addEventListener('dragover', e => {
                e.preventDefault(); // Cho phép thả
                if(!zone.classList.contains('correct')) {
                    zone.classList.add('hover');
                }
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('hover');
            });

            zone.addEventListener('drop', e => {
                e.preventDefault();
                zone.classList.remove('hover');
                
                // Bỏ qua nếu ô này đã có đáp án đúng
                if(zone.classList.contains('correct')) return;

                const draggedValue = e.dataTransfer.getData('value');
                const draggedId = e.dataTransfer.getData('id');
                const targetValue = zone.dataset.answer;

                if (draggedValue === targetValue) {
                    // Trả lời đúng
                    const cardElement = document.getElementById(draggedId);
                    zone.innerHTML = cardElement.innerHTML; // Copy HTML của phân số vào ô
                    zone.classList.add('correct');
                    cardElement.classList.add('used'); // Ẩn thẻ vừa kéo
                    
                    correctAnswers++;
                    messageDisplay.style.color = '#388e3c';
                    messageDisplay.innerText = "Chính xác! Giỏi lắm!";
                    
                    if (correctAnswers === dropZones.length) {
                        setTimeout(() => {
                            messageDisplay.style.color = '#d32f2f';
                            messageDisplay.innerText = "Tuyệt vời! Các em đã nhớ quy tắc giữ nguyên mẫu số!";
                        }, 1000);
                    } else {
                        setTimeout(() => messageDisplay.innerText = "", 1500);
                    }
                } else {
                    // Trả lời sai (có thể là dính bẫy)
                    messageDisplay.style.color = '#d32f2f';
                    if (draggedValue.includes('trap')) {
                        messageDisplay.innerText = "Ôi cẩn thận! Khi cộng hai phân số cùng mẫu, ta CHỈ cộng tử số và GIỮ NGUYÊN mẫu số nhé!";
                    } else {
                        messageDisplay.innerText = "Chưa đúng rồi, hãy tính nhẩm lại xem sao!";
                    }
                    setTimeout(() => messageDisplay.innerText = "", 3000);
                }
            });
        });
    </script>
</body>
</html>
