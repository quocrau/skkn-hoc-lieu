                        osc.stop(ctx.currentTime + i * 0.08 + 0.35);

        // --- IMMERSIVE PIZZA VISUALIZER WITH TRANSPARENT CROSSED-OUT SLICES ---
        const PizzaVisualizer = ({ question }) => {
            const parseFractionExpression = (exp) => {
                try {
                    const match = exp.match(/(\d+)\/(\d+)\s*-\s*(\d+)\/(\d+)/);
                    if (match) {
                        return {
                            minuend: parseInt(match[1]),
                            subtrahend: parseInt(match[3]),
                            total: parseInt(match[2])
                        };
                    }
                } catch (e) {}
                return { minuend: 8, subtrahend: 0, total: 8 };
            };

            const { minuend, subtrahend, total } = parseFractionExpression(question.q);
            const slices = [];
            const radius = 65;
            const cx = 80;
            const cy = 80;

            for (let i = 0; i < total; i++) {
                const angleStart = (i * 360) / total - 90;
                const angleEnd = ((i + 1) * 360) / total - 90;
                const radStart = (angleStart * Math.PI) / 180;
                const radEnd = (angleEnd * Math.PI) / 180;

                const x1 = cx + radius * Math.cos(radStart);
                const y1 = cy + radius * Math.sin(radStart);
                const x2 = cx + radius * Math.cos(radEnd);
                const y2 = cy + radius * Math.sin(radEnd);

                const d = `M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2} Z`;

                // Calculate midpoint angle for placement of "X" / cross mark
                const midAngle = (angleStart + angleEnd) / 2;
                const radMid = (midAngle * Math.PI) / 180;
                const midX = cx + (radius * 0.6) * Math.cos(radMid);
                const midY = cy + (radius * 0.6) * Math.sin(radMid);

                // Slice coloring
                let sliceFill = "#e2e8f0"; // Empty background
                let sliceStroke = "#cbd5e1";
                let showTomato = false;
                let showBasil = false;
                let isSubtracted = false;

                if (i < minuend) {
                    // Pizza Mozzarella Golden Cheese
                    sliceFill = "#fbbf24"; 
                    sliceStroke = "#ca8a04";
                    showTomato = true;
                    showBasil = (i % 2 === 0);

                    // If it is inside the subtracted zone
                    if (i >= (minuend - subtrahend)) {
                        isSubtracted = true;
                    }
                }

                slices.push(
                    <g key={i}>
                        <path
                            d={d}
                            fill={sliceFill}
                            stroke={sliceStroke}
                            strokeWidth="2"
                            className="transition-all duration-300"
                        />
                        {/* Pizza Toppings (pepperoni / tomato) */}
                        {showTomato && (
                            <circle cx={cx + (radius * 0.5) * Math.cos(radMid)} cy={cy + (radius * 0.5) * Math.sin(radMid)} r="6" fill="#ef4444" />
                        )}
                        {showBasil && (
                            <path d={`M ${cx + (radius * 0.7) * Math.cos(radMid)} ${cy + (radius * 0.7) * Math.sin(radMid)} q 3 -3 6 0 q -3 3 -6 0`} fill="#22c55e" />
                        )}
                        
                        {/* Interactive Darkened overlay with Red Cross Mark (Toppings taken away) */}
                        {isSubtracted && (
                            <>
                                <path
                                    d={d}
                                    fill="rgba(239, 68, 68, 0.25)" // Transparent red-gray cover
                                    stroke="#b91c1c"
                                    strokeWidth="1.5"
                                />
                                <path
                                    d={d}
                                    fill="rgba(30, 41, 59, 0.3)" // Transparent red-gray cover
                                />
                                {/* Bold Red Crossed-out Mark with drop shadow */}
                                <g transform={`translate(${midX}, ${midY})`}>
                                    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#ef4444" strokeWidth="3" strokeLinecap="round" />
                                    <line x1="5" y1="-5" x2="-5" y2="5" stroke="#ef4444" strokeWidth="3" strokeLinecap="round" />
                                </g>
                            </>
                        )}
                    </g>
                );
            }

            return (
                <div class="flex flex-col sm:flex-row items-center justify-around p-4 bg-amber-50 rounded-2xl border-4 border-amber-200 shadow-md w-full">
                    <div class="text-center sm:text-left space-y-1 max-w-[200px]">
                        <h4 class="text-sm font-black text-amber-700 uppercase">🍕 Đĩa Bánh Pizza Mozzarella</h4>
                        <p class="text-xs text-slate-500 font-bold">Các lát có dấu <span class="text-red-500 font-extrabold">X đỏ</span> biểu thị phần đã bị ăn/trừ đi.</p>
                        <p class="text-[11px] bg-amber-100 text-amber-900 font-bold px-2 py-1 rounded-md border border-amber-300 mt-2">
                            Ban đầu: <span class="font-extrabold text-xs">{minuend}/{total}</span> bánh. <br/>
                            Đã bớt: <span class="font-extrabold text-xs">{subtrahend}/{total}</span> bánh.
                        </p>
                    </div>

                    <div class="relative w-40 h-40 mt-3 sm:mt-0">
                        <svg width="100%" height="100%" viewBox="0 0 160 160">
                            {/* Crust base */}
                            <circle cx={cx} cy={cy} r={radius + 4} fill="#eab308" stroke="#ca8a04" strokeWidth="3" />
                            {slices}
                        </svg>
                    </div>
                </div>
            );
        };

        // --- CỬA 1: FROG POND MAP PROGRESS VISUALIZER ---
        const FrogPondMap = ({ currentIndex, totalQuestions }) => {
            const pads = [];
            const cols = 5;
            
            for (let i = 0; i < totalQuestions; i++) {

                    <div class="relative w-full h-44 bg-gradient-to-b from-sky-300 to-sky-400 rounded-xl overflow-hidden border-2 border-sky-500">

                                    <ellipse cx="0" cy="0" rx="9" ry="7" fill="#22c55e" stroke="#15803d" strokeWidth="1.5" />
                                    {/* Eyes */}
                                    <circle cx="-4" cy="-7" r="3.5" fill="white" stroke="#15803d" />
                                    <circle cx="-4" cy="-7" r="1.5" fill="black" />

                                    <circle cx="4" cy="-7" r="1.5" fill="black" />
                                    {/* Smile */}
                                    <path d="M -4 2 Q 0 5 4 2" stroke="#15803d" strokeWidth="1.5" fill="none" />
                                </g>
                            )}
                        </svg>
                    </div>
                </div>
            );
        };

        // --- CỬA 2: CATERPILLAR TREE PATH PROGRESS VISUALIZER ---
        const CaterpillarPathMap = ({ currentIndex, totalQuestions }) => {
            const steps = [];
            for (let i = 0; i < totalQuestions; i++) {
                const x = 20 + i * 12.5;
                const y = 50 + Math.sin(i * 1.2) * 15;

            const progressPercentage = Math.round((currentIndex / totalQuestions) * 100);

            return (

                    <h4 class="text-xs font-black uppercase text-emerald-700 mb-2 tracking-wide text-center">🐛 Hành Trình Sâu Bướm (Bản đồ Cửa 2)</h4>

        // --- MAIN GAME APP ---
        function App() {
            const [currentTab, setCurrentTab] = useState("home"); // home, gate1, gate2, teacher

            const [selectedAns, setSelectedAns] = useState(null);

            const [passes, setPasses] = useState(0);
            const [score, setScore] = useState(0);
            const [showExplain, setShowExplain] = useState(false);
            const [gameCompleted, setGameCompleted] = useState(false);
            const [confettiActive, setConfettiActive] = useState(false);

            // Pedagogical Spellbook Tip Modal
            const [showSpellbookModal, setShowSpellbookModal] = useState(false);
            const [hasRetried, setHasRetried] = useState(false);
            const [ambientOn, setAmbientOn] = useState(false);

            const activeQuestions = currentTab === "gate1" ? gate1Questions : gate2Questions;
            const activeQuestion = activeQuestions[questionIdx];

            // Handle ambient sounds loop
            useEffect(() => {
                let interval;
                if (ambientOn) {
                    playSound('ambient');
                    interval = setInterval(() => {
                        playSound('ambient');
                    }, 4000);
                }
                return () => clearInterval(interval);
            }, [ambientOn]);

            const triggerConfetti = () => {
                setConfettiActive(true);
                setTimeout(() => setConfettiActive(false), 4000);
            };

            const selectGate = (gate) => {
                playSound('click');
                setCurrentTab(gate);
                setQuestionIdx(0);
                setSelectedAns(null);
                setIsCorrect(null);
                setStreak(0);
                setPasses(0);
                setScore(0);
                setShowExplain(false);
                setGameCompleted(false);
                setHasRetried(false);
            };

            const handleAnswer = (option) => {
                if (selectedAns !== null) return; // Locked selection

                const correct = option === activeQuestion.ans;
                setSelectedAns(option);
                setIsCorrect(correct);

                if (correct) {
                    playSound('success');
                    setShowExplain(true);
                    const newStreak = streak + 1;
                    setStreak(newStreak);
                    
                    // Cap score slightly if student needed the spellbook retry
                    const pointsEarned = hasRetried ? 5 : 10;
                    setScore(score + pointsEarned);

                    if (newStreak % 5 === 0) {
                        setPasses(prev => prev + 1);
                        triggerConfetti();
                    }
                } else {
                    playSound('fail');
                    setStreak(0);
                    // Instead of blocking progress, prompt Robot's Spellbook Guide!
                    setTimeout(() => {
                        setShowSpellbookModal(true);
                    }, 500);
                }
            };

            const handleCloseSpellbookAndRetry = () => {
                playSound('click');
                setShowSpellbookModal(false);
                // Allow user to clear their wrong choice and pick again
                setSelectedAns(null);
                setIsCorrect(null);
                setHasRetried(true);
            };

            const handleNext = () => {
                playSound(currentTab === "gate1" ? 'jump' : 'click');
                setSelectedAns(null);
                setIsCorrect(null);
                setShowExplain(false);
                setHasRetried(false);

                if (questionIdx < activeQuestions.length - 1) {
                    setQuestionIdx(prev => prev + 1);
                } else {
                    setGameCompleted(true);
                    playSound('win');
                    triggerConfetti();
                }
            };

            const handleRestart = () => {
                selectGate(currentTab);
            };

            // Helpers to render fractions inside dynamic text
            const RenderFraction = ({ fractionStr }) => {

                            <button 
                                onClick={() => selectGate('teacher')}
                                class={`px-4 py-2.5 rounded-2xl text-xs font-black tracking-wider uppercase transition-all duration-300 ${currentTab === 'teacher' ? 'bg-purple-600 text-white shadow-md' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}`}
                            >
                                👩‍🏫 Góc Giáo Viên
                            </button>
                        </div>
                    </header>

                    {/* MAIN GAME CONTAINER */}
                    <main class="flex-1 flex flex-col justify-center">

                        {/* --- LANDING MENU --- */}
                        {currentTab === 'home' && (
                            <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-center bg-white/95 p-6 sm:p-10 rounded-3xl shadow-xl border-4 border-emerald-100">
                                <div class="md:col-span-7 space-y-6">
                                    <div class="inline-block bg-amber-100 border-2 border-amber-400 text-amber-950 px-3 py-1.5 rounded-full text-xs font-black tracking-wider uppercase animate-pulse-soft">
                                        🚀 Bản nâng cấp SVG Động Sắc Nét & Web Audio
                                    </div>
                                    <h2 class="text-3xl sm:text-5xl font-black text-slate-800 tracking-tight leading-none">
                                        Chinh Phục Phép Trừ <br/>
                                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-600 to-amber-500">Phân Số Sinh Động</span>
                                    </h2>
                                    <p class="text-slate-600 font-bold text-sm sm:text-base leading-relaxed">
                                        Chào đón thế giới trò chơi toán tiểu học hiện đại bậc nhất! Hãy trải nghiệm đĩa bánh Pizza Mozzarella gạch chéo thông minh và đầm lầy ếch nhảy sinh động bằng SVG nội tuyến.
                                    </p>

                                    {/* Choose gates */}
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                                        {/* Gate 1 */}
                                        <div 
                                            onClick={() => selectGate('gate1')}
                                            class="group cursor-pointer bg-gradient-to-b from-sky-50 to-blue-100/50 p-5 rounded-3xl border-4 border-sky-300 shadow-md hover:shadow-xl hover:border-sky-500 transition-all duration-300 transform hover:-translate-y-1"
                                        >
                                            <div class="flex items-center justify-between mb-3">
                                                <span class="text-3xl group-hover:scale-110 transition-transform">🐸</span>
                                                <span class="bg-sky-600 text-white text-[9px] font-black uppercase px-2.5 py-1 rounded-full">Cửa 1</span>
                                            </div>
                                            <h3 class="text-lg font-black text-sky-800 mb-1">Đầm Lầy Ếch Xanh</h3>
                                            <p class="text-xs text-sky-700/90 font-bold mb-3">Trừ hai phân số cùng mẫu số. Sơ đồ Pizza Mozzarella tự gạch chéo trực quan hóa hiệu số.</p>
                                            <span class="text-xs font-black text-sky-600 group-hover:underline">Bắt đầu ngay →</span>
                                        </div>

                                        {/* Gate 2 */}
                                        <div 
                                            onClick={() => selectGate('gate2')}
                                            class="group cursor-pointer bg-gradient-to-b from-emerald-50 to-green-100/50 p-5 rounded-3xl border-4 border-emerald-300 shadow-md hover:shadow-xl hover:border-emerald-500 transition-all duration-300 transform hover:-translate-y-1"
                                        >
                                            <div class="flex items-center justify-between mb-3">
                                                <span class="text-3xl group-hover:scale-110 transition-transform">🐛</span>
                                                <span class="bg-emerald-600 text-white text-[9px] font-black uppercase px-2.5 py-1 rounded-full">Cửa 2</span>
                                            </div>
                                            <h3 class="text-lg font-black text-emerald-800 mb-1">Hành Trình Sâu Bướm</h3>
                                            <p class="text-xs text-emerald-700/90 font-bold mb-3">Trừ phân số khác mẫu số. Cứu hộ cây non và giúp sâu hóa thành bướm xinh đẹp.</p>
                                            <span class="text-xs font-black text-emerald-600 group-hover:underline">Bắt đầu ngay →</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Mascot sidebar */}
                                <div class="md:col-span-5 flex flex-col items-center justify-center space-y-4 bg-slate-50 p-6 rounded-3xl border border-slate-200">
                                    <div class="flex items-center gap-6">
                                        <NamMascot />
                                        <RobotMascot state="idle" />
                                    </div>
                                    <div class="text-center space-y-2">
                                        <p class="font-extrabold text-slate-800 text-sm">Đồng Đội Học Tập</p>
                                        <p class="text-xs text-slate-500 font-bold max-w-xs">
                                            "Bọn mình đã thiết lập đầm lầy, đĩa bánh và khu vườn tuyệt đẹp rồi! Bạn hãy chọn một Cửa để thi tài nhé!"
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* --- PLAYGROUND INTERFACE --- */}
                        {(currentTab === 'gate1' || currentTab === 'gate2') && !gameCompleted && (
                            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                                
                                {/* Left column: Main activity */}
                                <div class="lg:col-span-7 bg-white/95 p-5 sm:p-7 rounded-3xl shadow-lg border-4 border-emerald-300 space-y-5">
                                    {/* Stats panel */}
                                    <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-slate-100 pb-3">
                                        <span class="bg-slate-100 text-slate-800 font-black text-xs px-3 py-1.5 rounded-xl">
                                            Câu {questionIdx + 1} / {activeQuestions.length}
                                        </span>
                                        <div class="flex gap-2">
                                            <span class="bg-amber-100 text-amber-900 font-black text-xs px-2.5 py-1.5 rounded-xl flex items-center gap-1">
                                                🔥 Chuỗi: {streak}
                                            </span>
                                            <span class="bg-purple-100 text-purple-900 font-black text-xs px-2.5 py-1.5 rounded-xl flex items-center gap-1">
                                                🎟️ Vé: {passes}
                                            </span>
                                            <span class="bg-emerald-100 text-emerald-900 font-black text-xs px-2.5 py-1.5 rounded-xl">
                                                ⭐ Điểm: {score}
                                            </span>
                                        </div>
                                    </div>

                                    {/* Interactive Progress Maps & Visualizers */}
                                    {currentTab === 'gate1' ? (
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
                                            <FrogPondMap currentIndex={questionIdx} totalQuestions={activeQuestions.length} />
                                            {activeQuestion.type === "calc" ? (
                                                <PizzaVisualizer question={activeQuestion} />
                                            ) : (
                                                <div class="bg-amber-50 p-4 rounded-2xl border-4 border-amber-200 flex flex-col justify-center items-center text-center w-full">
                                                    <span class="text-5xl animate-bounce">🍩</span>
                                                    <span class="text-xs font-black text-amber-800 uppercase mt-2">Bài Toán Thực Tế</span>
                                                    <p class="text-[10px] text-slate-500 font-bold mt-1">Vận dụng khéo léo phân số vào bài học cuộc sống.</p>
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <CaterpillarPathMap currentIndex={questionIdx} totalQuestions={activeQuestions.length} />
                                    )}

                                    {/* Question representation */}
                                    <div class="space-y-4">
                                        {activeQuestion.type === "word" && (
                                            <div class="bg-sky-50 border-2 border-sky-200 text-sky-950 p-4 rounded-2xl font-bold text-sm leading-relaxed shadow-sm">
                                                📚 <span class="font-black text-xs uppercase text-sky-700 block mb-1">Tình huống thực tế:</span>
                                                {activeQuestion.q}
                                            </div>
                                        )}

                                        <div class="text-center p-4 bg-slate-50 border border-slate-200 rounded-2xl">
                                            <span class="font-black text-slate-500 text-xs block uppercase tracking-wide mb-2">Đề bài toán</span>
                                            <div class="flex items-center justify-center flex-wrap gap-2 text-3xl font-black">
                                                {activeQuestion.type === "calc" ? (
                                                    <>
                                                        <RenderFraction fractionStr={activeQuestion.q.split('-')[0]} />
                                                        <span class="text-red-500 font-bold mx-1">-</span>
                                                        <RenderFraction fractionStr={activeQuestion.q.split('-')[1]} />
                                                        <span class="text-slate-400 font-bold mx-1">=</span>
                                                        <span class="text-emerald-500 bg-emerald-50 px-3 py-1.5 border-2 border-dashed border-emerald-400 rounded-xl">?</span>
                                                    </>
                                                ) : (
                                                    <span class="text-base sm:text-lg font-black text-slate-800 text-center">Hãy tìm ra đáp số đúng nhất cho bài toán trên!</span>
                                                )}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Dynamic Options list */}
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                                        {activeQuestion.options.map((opt, i) => {
                                            const isSelected = selectedAns === opt;
                                            const isCorrectAns = opt === activeQuestion.ans;
                                            let btnStyle = "bg-white border-slate-200 hover:border-emerald-400 text-slate-700 hover:bg-emerald-50/50";
                                            
                                            if (selectedAns !== null) {
                                                if (isCorrectAns) {
                                                    btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-900 scale-102 font-black";
                                                } else if (isSelected) {
                                                    btnStyle = "bg-rose-100 border-rose-500 text-rose-900";
                                                } else {
                                                    btnStyle = "bg-white border-slate-100 text-slate-400 opacity-50";
                                                }
                                            }

                                            return (
                                                <button
                                                    key={i}
                                                    disabled={selectedAns !== null}
                                                    onClick={() => handleAnswer(opt)}
                                                    class={`p-4 border-2 rounded-2xl text-lg font-bold transition-all duration-300 shadow-sm flex items-center justify-center gap-2 ${btnStyle}`}
                                                >
                                                    <span class="text-[10px] text-slate-400 bg-slate-100 w-5 h-5 rounded-full flex items-center justify-center font-black">
                                                        {String.fromCharCode(65 + i)}
                                                    </span>
                                                    <RenderFraction fractionStr={opt} />
                                                    {selectedAns !== null && isCorrectAns && <span class="text-emerald-600 text-lg">✅</span>}
                                                    {selectedAns !== null && isSelected && !isCorrectAns && <span class="text-rose-600 text-lg">❌</span>}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Right column: Mascot interaction & correct explain */}
                                <div class="lg:col-span-5 flex flex-col gap-4">
                                    
                                    {/* Mascot Interactive Panel */}
                                    <div class="bg-white/95 p-5 rounded-3xl shadow-lg border-4 border-amber-300 flex items-start gap-4">
                                        <div class="flex flex-col gap-2 items-center">
                                            <RobotMascot state={isCorrect === true ? "success" : isCorrect === false ? "fail" : "idle"} />
                                        </div>
                                        <div class="space-y-1">
                                            <h4 class="font-black text-amber-800 text-sm">Bình luận của Robot:</h4>
                                            <p class="text-xs text-slate-600 font-bold leading-relaxed">
                                                {currentTab === 'gate1' 
                                                    ? "Muốn trừ hai phân số cùng mẫu số, ta lấy tử số phân số thứ nhất trừ tử số phân số thứ hai và giữ nguyên mẫu số nhé!"
                                                    : "Để trừ phân số khác mẫu, bạn cần tìm mẫu số chung rồi quy đồng chúng về cùng mẫu số rồi mới thực hiện phép trừ!"
                                                }
                                            </p>
                                        </div>
                                    </div>

                                    {/* Feedback panel when answered correctly */}
                                    {showExplain && isCorrect && (
                                        <div class="p-5 rounded-3xl shadow-lg border-4 bg-emerald-50 border-emerald-300 text-emerald-950 space-y-3">
                                            <div class="flex items-center gap-2">
                                                <span class="text-2xl">🎉</span>
                                                <h4 class="font-black text-base">Hoàn toàn chính xác!</h4>
                                            </div>
                                            <p class="text-xs font-bold leading-relaxed">
                                                {activeQuestion.explain}
                                            </p>

                                            {/* Streak milestone bonus alert */}
                                            {streak % 5 === 0 && (
                                                <div class="bg-amber-100 border border-amber-400 text-amber-800 p-2 rounded-xl text-xs font-black text-center animate-bounce">
                                                    🎁 CHUỖI {streak} XUẤT SẮC! NHẬN ĐƯỢC 1 VÉ THÔNG HÀNH!
                                                </div>
                                            )}

                                            <button
                                                onClick={handleNext}
                                                class="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white font-extrabold rounded-2xl text-xs tracking-wider uppercase transition-all shadow-md active:translate-y-0.5"
                                            >
                                                {questionIdx < activeQuestions.length - 1 ? 'Câu Tiếp Theo ➔' : 'Xem Kết Quả Chung Cuộc ➔'}
                                            </button>
                                        </div>
                                    )}

                                </div>
                            </div>
                        )}

                        {/* --- "BÍ KÍP CỦA ROBOT" (PEDAGOGICAL WRONG-ANSWER RETRY MODAL) --- */}
                        {showSpellbookModal && (
                            <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex justify-center items-center z-50 p-4">
                                <div class="bg-white border-4 border-amber-400 rounded-3xl p-6 max-w-md w-full shadow-2xl relative space-y-4 animate-float">
                                    <div class="flex items-center gap-3 border-b-2 border-amber-200 pb-3">
                                        <div class="text-4xl">🤖</div>
                                        <div>
                                            <h3 class="text-lg font-black text-amber-900">Bí Kíp Phân Số Của Robot</h3>
                                            <p class="text-[10px] text-amber-700 font-extrabold uppercase tracking-wide">Giải cứu lỗi sai tức thời</p>
                                        </div>
                                    </div>

                                    <div class="space-y-2 text-xs font-bold text-slate-700 leading-relaxed">
                                        <p class="text-rose-600 bg-rose-50 p-2.5 rounded-xl border border-rose-200">
                                            ⚠️ Ôi! Câu trả lời vừa rồi chưa chính xác. Đừng nản chí nhé, hãy cùng Robot học lại cách giải đúng nào!
                                        </p>
                                        <div class="bg-amber-50/50 p-3.5 rounded-2xl border border-amber-200 space-y-1">
                                            <span class="block text-[11px] font-black text-amber-800 uppercase">Hướng dẫn từng bước:</span>
                                            <p class="text-slate-600 font-medium leading-relaxed">{activeQuestion.explain}</p>
                                        </div>
                                        <p class="text-[10px] text-slate-400 italic text-center mt-2">
                                            (Hệ thống cho phép bạn tự sửa lỗi sai bằng cách chọn lại đáp án đúng ngay sau đây!)
                                        </p>
                                    </div>

                                    <button
                                        onClick={handleCloseSpellbookAndRetry}
                                        class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-extrabold rounded-2xl text-xs uppercase tracking-wider transition-all shadow-md active:translate-y-0.5"
                                    >
                                        💪 Đã Hiểu! Tôi Muốn Thử Sửa Sai Ngay!
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* --- GAME COMPLETED SCREEN --- */}
                        {gameCompleted && (
                            <div class="max-w-2xl mx-auto bg-white/95 p-8 rounded-3xl shadow-xl border-4 border-amber-400 text-center space-y-6">
                                <div class="text-6xl animate-float">🏆</div>
                                <h2 class="text-3xl font-black text-amber-800 tracking-tight">Chiến Thắng Trọn Vẹn Hành Trình!</h2>
                                <p class="text-slate-600 font-bold max-w-md mx-auto">
                                    Tuyệt vời! Bạn đã hoàn thành toàn bộ 20 thử thách toán phân số tại <span class="text-emerald-600 font-black">{currentTab === 'gate1' ? 'Cửa 1: Đầm Lầy Ếch Xanh' : 'Cửa 2: Hành Trình Sâu Bướm'}</span> một cách xuất sắc!
                                </p>

                                <div class="grid grid-cols-3 gap-3 bg-amber-50 p-4 rounded-2xl border-2 border-amber-200">
                                    <div>
                                        <span class="block text-2xl">⭐</span>
                                        <span class="block text-xs text-slate-500 font-bold mt-1">Tổng điểm</span>
                                        <span class="block text-lg font-black text-amber-700">{score}</span>
                                    </div>
                                    <div>
                                        <span class="block text-2xl">🎟️</span>
                                        <span class="block text-xs text-slate-500 font-bold mt-1">Vé thông hành</span>
                                        <span class="block text-lg font-black text-purple-700">{passes}</span>
                                    </div>
                                    <div>
                                        <span class="block text-2xl">🎯</span>
                                        <span class="block text-xs text-slate-500 font-bold mt-1">Chuỗi cao nhất</span>
                                        <span class="block text-lg font-black text-emerald-700">{streak}</span>
                                    </div>
                                </div>

                                <div class="flex flex-col sm:flex-row gap-3 justify-center pt-2">
                                    <button
                                        onClick={handleRestart}
                                        class="px-6 py-3 bg-amber-500 hover:bg-amber-600 text-white font-extrabold rounded-2xl text-xs uppercase tracking-wider shadow-md transition-all"
                                    >
                                        🔄 Chơi Lại Cửa Này
                                    </button>
                                    <button
                                        onClick={() => selectGate('home')}
                                        class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-2xl text-xs uppercase tracking-wider shadow-md transition-all"
                                    >
                                        🏠 Về Trang Chủ Chọn Cửa Khác
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* --- TEACHER CORNER LISTING --- */}
                        {currentTab === 'teacher' && (
                            <div class="bg-white/95 p-6 sm:p-8 rounded-3xl shadow-lg border-4 border-purple-400 space-y-6">
                                <div class="flex flex-col sm:flex-row items-center justify-between gap-4 border-b-2 border-slate-100 pb-4">
                                    <div>
                                        <h2 class="text-2xl font-black text-purple-800">👩‍🏫 Góc Giáo Viên & Trọng Tài Sư Phạm</h2>
                                        <p class="text-xs text-slate-500 font-bold">In trực tiếp danh sách 40 câu hỏi và lời giải chi tiết để hỗ trợ tổ chức các hoạt động thi đua tiếp sức trên lớp.</p>
                                    </div>
                                    <button
                                        onClick={() => window.print()}
                                        class="bg-purple-100 hover:bg-purple-200 text-purple-700 font-black px-4 py-2.5 rounded-xl text-xs transition-all uppercase tracking-wider"
                                    >
                                        🖨️ In Phiếu Câu Hỏi & Đáp Án
                                    </button>
                                </div>

                                {/* Class game rules */}
                                <div class="bg-purple-50 border-l-4 border-purple-500 p-4 rounded-r-xl">
                                    <h3 class="font-extrabold text-purple-800 text-sm mb-1">🎮 Trò chơi "Tiếp sức đồng đội":</h3>
                                    <p class="text-xs text-slate-700 font-medium leading-relaxed">
                                        Chia lớp thành các nhóm. Thành viên mỗi nhóm lần lượt giải các câu hỏi từ hệ thống. Khi đạt được 5 câu đúng liên tiếp nhóm sẽ được cấp "Vé thông hành" để mở ra chặng tiếp theo. Nhóm có nhiều điểm số nhất sau thời gian quy định sẽ thắng cuộc!
                                    </p>
                                </div>

                                {/* Collapsible question data bank */}
                                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div>
                                        <h3 class="text-base font-black text-sky-800 mb-3 border-b pb-1">🐸 CỬA 1: ĐẦM LẦY ẾCH XANH (20 Câu)</h3>
                                        <div class="space-y-3 max-h-[400px] overflow-y-auto pr-2">
                                            {gate1Questions.map((q, idx) => (
                                                <div key={idx} class="p-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs space-y-1">
                                                    <p class="font-black text-slate-800">
                                                        Câu {idx + 1}: {q.type === 'word' ? '[Toán đố]' : '[Tính]'} {q.q}
                                                    </p>
                                                    <p class="text-emerald-700 font-black">Đáp án: {q.ans}</p>
                                                    <p class="text-slate-500 font-bold">Giải nghĩa: {q.explain}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <h3 class="text-base font-black text-emerald-800 mb-3 border-b pb-1">🐛 CỬA 2: HÀNH TRÌNH SÂU BƯỚM (20 Câu)</h3>
                                        <div class="space-y-3 max-h-[400px] overflow-y-auto pr-2">
                                            {gate2Questions.map((q, idx) => (
                                                <div key={idx} class="p-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs space-y-1">
                                                    <p class="font-black text-slate-800">
                                                        Câu {idx + 1}: {q.type === 'word' ? '[Toán đố]' : '[Tính]'} {q.q}
                                                    </p>
                                                    <p class="text-emerald-700 font-black">Đáp án: {q.ans}</p>
                                                    <p class="text-slate-500 font-bold">Giải nghĩa: {q.explain}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Footer */}
                    <footer class="mt-8 text-center text-xs text-slate-400 font-bold border-t border-slate-200/50 pt-4 flex flex-col sm:flex-row items-center justify-between gap-2">
                        <span>Chương trình Giáo dục phổ thông 2018 - Môn Toán Lớp 4 (Cánh Diều & Kết nối tri thức)</span>
                        <span class="bg-slate-100 text-slate-500 px-3 py-1 rounded-full text-[10px] font-black uppercase">QUOCRAU AI SYSTEM V3.0</span>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
