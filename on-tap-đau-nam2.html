<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHẦN 2: PHÉP CỘNG, PHÉP TRỪ & GIÁ TRỊ BIỂU THỨC</title>
    <style>
        :root { --primary: #00b894; --secondary: #00cec9; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .game-card { background: white; border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.2); width: 100%; max-width: 800px; padding: 25px; text-align: center; }
        .header { background: #00b894; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .q-title { font-size: 1.2rem; margin-bottom: 20px; text-align: left; color: #333; font-weight: 600; line-height: 1.5; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        @media(max-width: 600px){ .btn-grid { grid-template-columns: 1fr; } }
        .opt-btn { background: #f8f9fa; border: 2px solid #dee2e6; border-radius: 12px; padding: 14px; text-align: left; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .opt-btn:hover { background: #e6fffa; border-color: #00b894; }
        .opt-btn.correct { background: #d4edda !important; border-color: #28a745 !important; color: #155724; font-weight: bold; }
        .opt-btn.incorrect { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }
        .next-btn, .start-btn { background: #00b894; color: white; border: none; padding: 12px 30px; font-size: 1.1rem; border-radius: 30px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .feedback { margin: 15px 0; padding: 12px; border-radius: 8px; font-weight: 500; text-align: left; display: none; }
        .feedback.correct { background: #d4edda; color: #155724; display: block; }
        .feedback.incorrect { background: #f8d7da; color: #721c24; display: block; }
    </style>
</head>
<body>
<div class="game-card">
    <div class="header">
        <span>➕➖ PHẦN 2: PHÉP CỘNG, TRỪ & GIÁ TRỊ BIỂU THỨC</span>
        <span>Điểm: <span id="score">0</span>/50</span>
    </div>
    <div id="quiz-area">
        <div class="q-title" id="q-text"></div>
        <div class="btn-grid" id="opts"></div>
        <div class="feedback" id="fb"></div>
        <button class="next-btn" id="next-btn" style="display:none;" onclick="nextQ()">Câu tiếp theo ➔</button>
    </div>
    <div id="result-area" style="display:none;">
        <h2>HOÀN THÀNH PHẦN 2! 🎉</h2>
        <p style="font-size:1.3rem; margin:20px 0;">Số điểm của em: <strong id="final-score" style="color:#00b894;">0</strong> / 50</p>
        <button class="start-btn" onclick="location.reload()">Làm lại bài</button>
    </div>
</div>
<script>
const data = [
    { q: "1. Tính nhẩm: 73 000 - 3 000 - 50 000 =", opts: ["20 000", "70 000", "30 000", "10 000"], c: 0, exp: "73 000 - 3 000 = 70 000; 70 000 - 50 000 = 20 000." },
    { q: "2. Kết quả của phép tính đặt tính 58 623 + 25 047 là:", opts: ["83 670", "83 660", "82 670", "83 570"], c: 0, exp: "58 623 + 25 047 = 83 670." },
    { q: "3. Kết quả của phép tính đặt tính 74 528 - 16 240 là:", opts: ["58 288", "58 388", "58 188", "68 288"], c: 0, exp: "74 528 - 16 240 = 58 288." },
    { q: "4. Tính giá trị biểu thức: 16 000 + 8 140 + 2 760 =", opts: ["26 900", "26 800", "27 000", "25 900"], c: 0, exp: "8 140 + 2 760 = 10 900. Lấy 16 000 + 10 900 = 26 900." },
    { q: "5. Giá một hộp bút là 16 500 đồng, một balo đắt hơn hộp bút 62 500 đồng. Mẹ mua cho An cả hai thứ hết bao nhiêu tiền?", opts: ["95 500 đồng", "79 000 đồng", "94 500 đồng", "95 000 đồng"], c: 0, exp: "Giá balo = 16 500 + 62 500 = 79 000 đồng. Tổng = 16 500 + 79 000 = 95 500 đồng." }
];
let idx = 0, score = 0;
function loadQ() {
    const item = data[idx];
    document.getElementById('q-text').innerText = item.q;
    const optsDiv = document.getElementById('opts');
    optsDiv.innerHTML = '';
    document.getElementById('fb').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    item.opts.forEach((o, i) => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.innerHTML = `<b>${String.fromCharCode(65+i)}.</b> ${o}`;
        b.onclick = () => check(i, b);
        optsDiv.appendChild(b);
    });
}
function check(i, btn) {
    const item = data[idx];
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(b => b.style.pointerEvents = 'none');
    const fb = document.getElementById('fb');
    if(i === item.c) {
        btn.classList.add('correct');
        score += 10;
        document.getElementById('score').innerText = score;
        fb.className = 'feedback correct';
        fb.innerHTML = '✨ <b>Chính xác!</b> ' + item.exp;
    } else {
        btn.classList.add('incorrect');
        btns[item.c].classList.add('correct');
        fb.className = 'feedback incorrect';
        fb.innerHTML = '❌ <b>Chưa đúng!</b> ' + item.exp;
    }
    document.getElementById('next-btn').style.display = 'inline-block';
}
function nextQ() {
    idx++;
    if(idx < data.length) loadQ();
    else {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('final-score').innerText = score;
    }
}
loadQ();
</script>
</body>
</html>
