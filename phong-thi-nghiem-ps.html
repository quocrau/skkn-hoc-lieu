<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game: Phòng Thí Nghiệm Phân Số - Lớp 4</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap');

        :root {
            --bg: #f0f8ff;
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #1e293b;
            --card: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Header & Score */
        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 3px solid #e2e8f0;
        }
        
        .title h1 { color: var(--primary-dark); font-weight: 900; font-size: 28px; }
        .title p { color: #64748b; font-weight: 700; }
        
        .score-board {
            background: #fffbeb;
            border: 3px solid var(--warning);
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 24px;
            font-weight: 900;
            color: #d97706;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Instructions & Questions */
        .scaffold-box {
            width: 100%;
            max-width: 900px;
            background: #e0f2fe;
            border-left: 6px solid var(--primary);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-weight: 700;
            font-size: 18px;
            color: #0369a1;
        }

        /* Main Game Area */
        .game-area {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .game-area { flex-direction: column; }
            header { flex-direction: column; text-align: center; gap: 15px; }
        }

        /* Fraction Cards */
        .frac-card {
            flex: 1;
            background: var(--card);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            border: 3px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .frac-card.f1 { border-top: 8px solid var(--danger); }
        .frac-card.f2 { border-top: 8px solid var(--primary); }

        .card-title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 15px;
            color: #334155;
        }

        /* Visual Bar */
        .visual-bar-container {
            width: 100%;
            height: 60px;
            background: #f1f5f9;
            border-radius: 10px;
            border: 3px solid #cbd5e1;
            overflow: hidden;
            display: grid;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .piece {
            height: 100%;
            border-right: 2px solid #fff;
            transition: background 0.3s;
        }
        .piece:last-child { border-right: none; }
        
        .f1 .piece.active { background: var(--danger); }
        .f2 .piece.active { background: var(--primary); }

        /* Sliders */
        .control-group {
            width: 100%;
            margin-bottom: 15px;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            margin-bottom: 5px;
            color: #475569;
        }
        input[type=range] {
            width: 100%;
            accent-color: var(--warning);
            cursor: pointer;
        }

        /* The Multiplier (Dao cắt) */
        .multiplier-zone {
            width: 100%;
            background: #fff7ed;
            border: 2px dashed #fdba74;
            padding: 15px;
            border-radius: 12px;
            margin-top: 10px;
            text-align: center;
        }
        .multiplier-zone span { font-weight: 900; font-size: 20px; color: #ea580c; }

        /* Math Display */
        .math-text {
            font-size: 40px;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
            line-height: 1;
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }
        .math-text .num { border-bottom: 4px solid var(--text); padding: 0 10px 2px; }
        .math-text .den { padding: 2px 10px 0; }

        /* Action Buttons */
        .actions {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            font-weight: 900;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.2s;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
        }
        button:active { transform: translateY(5px); box-shadow: 0 0 0 rgba(0,0,0,0.2); }
        
        .btn-test { background: var(--secondary); }
        .btn-test:hover { background: #059669; }
        
        .btn-reset { background: #64748b; }
        .btn-reset:hover { background: #475569; }

        /* Feedback & Conclusion Area */
        .feedback-area {
            width: 100%;
            max-width: 900px;
            background: #f8fafc;
            border: 4px dashed #cbd5e1;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: 700;
            color: #334155;
            transition: 0.3s;
        }

        .feedback-area.error { border-color: var(--danger); background: #fef2f2; color: #b91c1c; }
        .feedback-area.success { border-color: var(--secondary); background: #f0fdf4; color: #047857; }

        .conclusion-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #fff;
            border-radius: 10px;
            color: var(--text);
            font-size: 18px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* Result Modal Visuals */
        .result-operator { font-size: 50px; font-weight: 900; color: var(--warning); margin: 0 20px;}

    </style>
</head>
<body>

    <header>
        <div class="title">
            <h1>Phòng Thí Nghiệm Phân Số 🔬</h1>
            <p>Khám phá bản chất quy đồng & so sánh</p>
        </div>
        <div class="score-board">
            ⭐ <span id="scoreText">0</span> Điểm
        </div>
    </header>

    <div class="scaffold-box" id="scaffoldText">
        🤔 Câu hỏi khám phá: Hãy tạo ra 2 phân số bất kỳ. Em có thể đoán xem phân số nào lớn hơn không? Thử nhấn "Kiểm tra giả thuyết" xem sao!
    </div>

    <div class="game-area">
        <!-- Fraction 1 Card -->
        <div class="frac-card f1">
            <div class="card-title">Phân số A</div>
            
            <div class="visual-bar-container" id="bar1"></div>
            
            <div class="math-text" id="math1">
                <div class="num" id="n1-disp">1</div>
                <div class="den" id="d1-disp">2</div>
            </div>

            <div class="control-group">
                <label>Tử số (Số phần tô màu): <span id="n1-val">1</span></label>
                <input type="range" id="n1-slider" min="1" max="10" value="1">
            </div>
            <div class="control-group">
                <label>Mẫu số (Tổng số phần): <span id="d1-val">2</span></label>
                <input type="range" id="d1-slider" min="1" max="10" value="2">
            </div>

            <div class="multiplier-zone">
                <label style="font-weight: 700; color:#c2410c;">Máy cắt (Hệ số nhân): <span id="m1-val">x1</span></label>
                <input type="range" id="m1-slider" min="1" max="5" value="1">
            </div>
        </div>

        <!-- Fraction 2 Card -->
        <div class="frac-card f2">
            <div class="card-title">Phân số B</div>
            
            <div class="visual-bar-container" id="bar2"></div>
            
            <div class="math-text" id="math2">
                <div class="num" id="n2-disp">2</div>
                <div class="den" id="d2-disp">3</div>
            </div>

            <div class="control-group">
                <label>Tử số (Số phần tô màu): <span id="n2-val">2</span></label>
                <input type="range" id="n2-slider" min="1" max="10" value="2">
            </div>
            <div class="control-group">
                <label>Mẫu số (Tổng số phần): <span id="d2-val">3</span></label>
                <input type="range" id="d2-slider" min="1" max="10" value="3">
            </div>

            <div class="multiplier-zone">
                <label style="font-weight: 700; color:#c2410c;">Máy cắt (Hệ số nhân): <span id="m2-val">x1</span></label>
                <input type="range" id="m2-slider" min="1" max="5" value="1">
            </div>
        </div>
    </div>

    <div class="actions">
        <button class="btn-test" onclick="checkHypothesis()">🔍 Kiểm tra giả thuyết (So Sánh)</button>
        <button class="btn-reset" onclick="resetGame()">🔄 Khám phá lại</button>
    </div>

    <div class="feedback-area" id="feedback">
        Vùng hiển thị kết quả phân tích hệ thống.
        <div class="conclusion-box" id="conclusion"></div>
    </div>

    <script>
        // Game State Variables
        let score = 0;
        let isSuccess = false;

        // DOM Elements
        const n1Slider = document.getElementById('n1-slider');
        const d1Slider = document.getElementById('d1-slider');
        const m1Slider = document.getElementById('m1-slider');
        
        const n2Slider = document.getElementById('n2-slider');
        const d2Slider = document.getElementById('d2-slider');
        const m2Slider = document.getElementById('m2-slider');

        const bar1 = document.getElementById('bar1');
        const bar2 = document.getElementById('bar2');
        const math1 = document.getElementById('math1');
        const math2 = document.getElementById('math2');
        
        const feedback = document.getElementById('feedback');
        const conclusion = document.getElementById('conclusion');
        const scaffoldText = document.getElementById('scaffoldText');
        const scoreText = document.getElementById('scoreText');

        // Logic functions
        function updateVisuals() {
            // Get original values
            let n1 = parseInt(n1Slider.value);
            let d1 = parseInt(d1Slider.value);
            let m1 = parseInt(m1Slider.value);

            let n2 = parseInt(n2Slider.value);
            let d2 = parseInt(d2Slider.value);
            let m2 = parseInt(m2Slider.value);

            // Validation logic: Numerator cannot exceed Denominator
            if(n1 > d1) { n1 = d1; n1Slider.value = d1; }
            if(n2 > d2) { n2 = d2; n2Slider.value = d2; }

            // Update Text Labels for Sliders
            document.getElementById('n1-val').textContent = n1;
            document.getElementById('d1-val').textContent = d1;
            document.getElementById('m1-val').textContent = `x${m1}`;
            
            document.getElementById('n2-val').textContent = n2;
            document.getElementById('d2-val').textContent = d2;
            document.getElementById('m2-val').textContent = `x${m2}`;

            // Calculate active values (after multiplier)
            let actN1 = n1 * m1;
            let actD1 = d1 * m1;
            
            let actN2 = n2 * m2;
            let actD2 = d2 * m2;

            // Update Math Text
            document.getElementById('n1-disp').textContent = actN1;
            document.getElementById('d1-disp').textContent = actD1;
            document.getElementById('n2-disp').textContent = actN2;
            document.getElementById('d2-disp').textContent = actD2;

            // Draw Bars
            drawBar(bar1, actN1, actD1);
            drawBar(bar2, actN2, actD2);

            // Dynamic Scaffolding Question Update
            if (m1 > 1 || m2 > 1) {
                scaffoldText.innerHTML = "💡 <b>Quan sát:</b> Khi dùng 'Máy cắt', số phần tăng lên nhưng kích thước phần màu tô tổng cộng có bị thay đổi không?";
            } else {
                scaffoldText.innerHTML = "🤔 <b>Câu hỏi khám phá:</b> Hãy tạo ra 2 phân số bất kỳ. Thử nhấn 'Kiểm tra giả thuyết' xem sao!";
            }
            
            // Reset feedback style if changing values
            if(isSuccess) {
                feedback.className = 'feedback-area';
                feedback.innerHTML = "Dữ liệu đã thay đổi. Hãy kiểm tra lại!";
                isSuccess = false;
            }
        }

        function drawBar(container, num, den) {
            container.innerHTML = '';
            container.style.gridTemplateColumns = `repeat(${den}, 1fr)`;
            for(let i = 0; i < den; i++) {
                let piece = document.createElement('div');
                piece.className = 'piece';
                if(i < num) piece.classList.add('active');
                container.appendChild(piece);
            }
        }

        function checkHypothesis() {
            let actD1 = parseInt(d1Slider.value) * parseInt(m1Slider.value);
            let actD2 = parseInt(d2Slider.value) * parseInt(m2Slider.value);
            
            let actN1 = parseInt(n1Slider.value) * parseInt(m1Slider.value);
            let actN2 = parseInt(n2Slider.value) * parseInt(m2Slider.value);

            feedback.classList.remove('error', 'success');

            // Cốt lõi Sư phạm: Bắt lỗi khác mẫu số
            if(actD1 !== actD2) {
                feedback.classList.add('error');
                feedback.innerHTML = `
                    <div style="font-size: 40px; margin-bottom: 10px;">⚠️ LỖI CẤU TRÚC!</div>
                    Kích thước các mảnh ghép (Mẫu số) đang khác nhau (${actD1} và ${actD2}). <br>
                    Không thể so sánh công bằng! Hãy dùng <b>'Máy cắt'</b> để quy đồng cho chúng bằng nhau nhé!
                `;
                isSuccess = false;
            } else {
                // Thành công: Cùng mẫu số
                isSuccess = true;
                score += 100;
                scoreText.textContent = score;

                let sign = "=";
                let word = "bằng";
                if(actN1 > actN2) { sign = ">"; word = "lớn hơn"; }
                if(actN1 < actN2) { sign = "<"; word = "bé hơn"; }

                feedback.classList.add('success');
                feedback.innerHTML = `
                    <div style="font-size: 40px; margin-bottom: 10px;">🎉 QUY ĐỒNG THÀNH CÔNG!</div>
                    <div style="display: flex; align-items: center; justify-content: center;">
                        <div class="math-text"><div class="num">${actN1}</div><div class="den">${actD1}</div></div>
                        <div class="result-operator">${sign}</div>
                        <div class="math-text"><div class="num">${actN2}</div><div class="den">${actD2}</div></div>
                    </div>
                    <div class="conclusion-box" style="display: block;">
                        <b>📝 BÀI HỌC RÚT RA:</b><br>
                        "Khi hai phân số đã có chung Mẫu số (Cùng kích thước mảnh cắt), phân số nào có Tử số (Số mảnh được lấy) lớn hơn thì phân số đó <b>${word}</b>."<br>
                        <i>Đó là lý do ta phải quy đồng trước khi so sánh hoặc làm phép cộng/trừ!</i>
                    </div>
                `;
                
                scaffoldText.innerHTML = "🌟 Tuyệt vời! Em đã tự phát hiện ra quy luật. Hãy bấm 'Khám phá lại' để thử với các số khác nhé!";
            }
        }

        function resetGame() {
            n1Slider.value = 1; d1Slider.value = 2; m1Slider.value = 1;
            n2Slider.value = 2; d2Slider.value = 3; m2Slider.value = 1;
            feedback.className = 'feedback-area';
            feedback.innerHTML = "Vùng hiển thị kết quả phân tích hệ thống.";
            isSuccess = false;
            updateVisuals();
        }

        // Attach Event Listeners
        const sliders = [n1Slider, d1Slider, m1Slider, n2Slider, d2Slider, m2Slider];
        sliders.forEach(slider => {
            slider.addEventListener('input', updateVisuals);
        });

        // Init
        updateVisuals();

    </script>
</body>
</html>
