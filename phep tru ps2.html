        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
                    osc.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.3); // C6
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);
                } else if (type === 'fail') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime); // A3
                    osc.frequency.setValueAtTime(147, ctx.currentTime + 0.15); // D3
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } else if (type === 'win') {
                    // Winning fanfare
                    const freqs = [523, 587, 659, 698, 783, 880, 987, 1046];
                    freqs.forEach((f, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.type = 'triangle';
                        o.frequency.value = f;
                        g.gain.setValueAtTime(0.1, ctx.currentTime + i*0.08);
                        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i*0.08 + 0.2);
                        o.start(ctx.currentTime + i*0.08);
                        o.stop(ctx.currentTime + i*0.08 + 0.25);
                    });
                }
            } catch (e) {
                console.log("Audio not supported or interaction needed first.", e);
            }

        // Custom Confetti Component on Canvas
        const ConfettiEffect = ({ active }) => {
            const canvasRef = useRef(null);

            useEffect(() => {
                if (!active) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationId;
                
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                const colors = ['#f43f5e', '#3b82f6', '#10b981', '#eab308', '#a855f7', '#ff7849'];
                const particles = Array.from({ length: 100 }).map(() => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 6 + 4,
                    d: Math.random() * canvas.height,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10 - 5,
                    tiltAngleIncremental: Math.random() * 0.07 + 0.02,
                    tiltAngle: 0
                }));

                const draw = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach((p, idx) => {
                        p.tiltAngle += p.tiltAngleIncremental;
                        p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                        p.x += Math.sin(p.tiltAngle);
                        p.tilt = Math.sin(p.tiltAngle - idx / 3) * 15;

                        if (p.y > canvas.height) {
                            p.x = Math.random() * canvas.width;
                            p.y = -20;
                            p.tilt = Math.random() * 10 - 5;
                        }

                        ctx.beginPath();
                        ctx.lineWidth = p.r;
                        ctx.strokeStyle = p.color;
                        ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                        ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                        ctx.stroke();
                    });
                    animationId = requestAnimationFrame(draw);
                };

                draw();

                const handleResize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    cancelAnimationFrame(animationId);
                    window.removeEventListener('resize', handleResize);
                };
            }, [active]);

            if (!active) return null;
            return <canvas ref={canvasRef} class="fixed inset-0 pointer-events-none z-50 w-full h-full" />;
        };

        // Standard dynamic Fraction renderer for visually stunning formulas
        const RenderFraction = ({ fractionStr }) => {
            if (!fractionStr.includes('/')) return <span class="font-extrabold text-2xl px-2">{fractionStr}</span>;
            const [num, den] = fractionStr.split(' '); // handle strings with spaces if any
            const parts = fractionStr.trim().split('/');
            const numerator = parts[0];
            const denominator = parts[1];
            return (
                <div class="inline-flex flex-col items-center justify-center mx-1 align-middle">
                    <span class="text-xl font-bold text-slate-800 border-b-2 border-slate-700 pb-0.5 px-1">{numerator}</span>
                    <span class="text-xl font-bold text-slate-800 pt-0.5 px-1">{denominator}</span>
                </div>
            );
        };

        // --- SUB-COMPONENT: PIZZA VISUALIZER FOR GATE 1 ---
        const PizzaVisualizer = ({ question }) => {
            // Parses "7/8 - 2/8" -> Minuend: 7, Subtrahend: 2, Total/Mẫu: 8
            const parseFractionExpression = (exp) => {
                try {
                    const match = exp.match(/(\d+)\/(\d+)\s*-\s*(\d+)\/(\d+)/);
                    if (match) {
                        return {
                            minuend: parseInt(match[1]),
                            subtrahend: parseInt(match[3]),
                            total: parseInt(match[2])
                        };
                    }
                } catch (e) {}
                return { minuend: 8, subtrahend: 0, total: 8 };
            };

            const { minuend, subtrahend, total } = parseFractionExpression(question.q);
            const slices = [];
            const radius = 60;
            const cx = 75;
            const cy = 75;

            for (let i = 0; i < total; i++) {
                const angleStart = (i * 360) / total - 90;
                const angleEnd = ((i + 1) * 360) / total - 90;
                const radStart = (angleStart * Math.PI) / 180;
                const radEnd = (angleEnd * Math.PI) / 180;

                const x1 = cx + radius * Math.cos(radStart);
                const y1 = cy + radius * Math.sin(radStart);
                const x2 = cx + radius * Math.cos(radEnd);
                const y2 = cy + radius * Math.sin(radEnd);

                const d = `M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2} Z`;

                // Color coding
                let color = "#e2e8f0"; // xám rỗng
                let border = "#94a3b8";
                if (i < (minuend - subtrahend)) {
                    color = "#fb923c"; // cam - phần còn lại sau khi trừ
                    border = "#ea580c";
                } else if (i < minuend) {
                    color = "#ef4444"; // đỏ - phần bị trừ đi
                    border = "#b91c1c";
                }

                slices.push(
                    <path
                        key={i}
                        d={d}
                        fill={color}
                        stroke={border}
                        strokeWidth="1.5"
                        class="transition-all duration-500 hover:opacity-90"
                    />
                );
            }

            return (
                <div class="flex flex-col items-center justify-center p-3 bg-amber-50 rounded-2xl border-4 border-amber-200 shadow-inner">
                    <h4 class="text-xs font-black uppercase text-amber-600 mb-1 tracking-wide">Mô phỏng Pizza thực tế</h4>
                    <svg width="150" height="150" viewBox="0 0 150 150">
                        {/* Pizza Crust Outline */}
                        <circle cx={cx} cy={cy} r={radius + 4} fill="#fcd34d" stroke="#d97706" strokeWidth="2" />
                        {slices}
                        {/* Pizza Pepperonis inside slices (simulated with small circles inside colored slices) */}
                        <circle cx={cx} cy={cy} r="6" fill="#fef08a" stroke="#ca8a04" />
                    </svg>
                    <div class="flex gap-4 mt-2 text-xs font-semibold">
                        <span class="flex items-center gap-1">
                            <span class="w-3 h-3 bg-orange-400 rounded-full inline-block border border-orange-600"></span> Còn lại
                        </span>
                        <span class="flex items-center gap-1">
                            <span class="w-3 h-3 bg-red-500 rounded-full inline-block border border-red-700"></span> Trừ đi
                        </span>
                        <span class="flex items-center gap-1">
                            <span class="w-3 h-3 bg-slate-200 rounded-full inline-block border border-slate-400"></span> Khuyết
                        </span>
                    </div>
                </div>
            );
        };


        // --- SUB-COMPONENT: GARDEN SCENE FOR GATE 2 ---
        const GardenVisualizer = ({ questionIndex, totalQuestions }) => {
            const progressPercentage = Math.round((questionIndex / totalQuestions) * 100);
            
            return (
                <div class="bg-emerald-50 p-4 rounded-2xl border-4 border-emerald-200 shadow-inner relative overflow-hidden">
                    <h4 class="text-xs font-black uppercase text-emerald-600 mb-2 tracking-wide text-center">Bản Đồ Cứu Hộ Sân Vườn</h4>
                    
                    {/* Garden Track */}
                    <div class="relative w-full h-24 bg-gradient-to-b from-sky-100 to-emerald-100 rounded-xl border-2 border-emerald-200 overflow-hidden">
                        {/* Clouds */}
                        <div class="absolute top-2 left-4 text-slate-300 text-xl opacity-40">☁️</div>
                        <div class="absolute top-4 right-8 text-slate-300 text-xl opacity-40">☁️</div>
                        
                        {/* Safe Zone (Fresh leaf/pond at the end) */}
                        <div class="absolute right-2 top-1/2 -translate-y-1/2 flex flex-col items-center z-10">
                            <div class="text-3xl animate-float">🍃</div>
                            <span class="text-[9px] bg-emerald-600 text-white px-1 rounded font-bold">Đích Đến</span>
                        </div>

                        {/* Path track representing the ecosystem road */}
                        <div class="absolute bottom-2 left-0 right-0 h-3 bg-amber-800 border-t border-amber-950"></div>
                        
                        {/* Dynamic Caterpillar / Frog moving across the screen */}
                        <div 
                            className="absolute bottom-4 transition-all duration-1000 ease-out flex flex-col items-center"
                            style={{ left: `calc(${progressPercentage}% * 0.8 + 5px)` }}
                        >
                            {/* Alternating cute characters based on index */}
                            <div class="text-3xl animate-bounce" style={{ animationDuration: '1.2s' }}>
                                {questionIndex % 2 === 0 ? "🐛" : "🐸"}
                            </div>
                            <span class="text-[9px] bg-amber-500 text-white px-1.5 py-0.5 rounded-full font-extrabold shadow">
                                {questionIndex % 2 === 0 ? "Sâu con" : "Ếch xanh"}
                            </span>
                        </div>
                    </div>
                    
                    <div class="mt-2 text-center text-xs text-emerald-800 font-bold">
                        Đã giúp sinh vật đi được <span class="text-emerald-600 text-sm font-black">{progressPercentage}%</span> quãng đường!
                    </div>
                </div>
            );
        };


        // --- MAIN APP COMPONENT ---
        function App() {
            const [currentTab, setCurrentTab] = useState("home"); // home, gate1, gate2, teacher
            const [questionIdx, setQuestionIdx] = useState(0);
            const [selectedAns, setSelectedAns] = useState(null);
            const [isCorrect, setIsCorrect] = useState(null);
            const [streak, setStreak] = useState(0);
            const [passes, setPasses] = useState(0); // Transit passes earned
            const [score, setScore] = useState(0);
            const [showExplain, setShowExplain] = useState(false);
            const [gameCompleted, setGameCompleted] = useState(false);
            const [confettiActive, setConfettiActive] = useState(false);

            const activeQuestions = currentTab === "gate1" ? gate1Questions : gate2Questions;
            const activeQuestion = activeQuestions[questionIdx];

            // Trigger a wave of confetti
            const triggerConfetti = () => {
                setConfettiActive(true);
                setTimeout(() => setConfettiActive(false), 4000);
            };

            const selectGate = (gate) => {
                playSound('click');
                setCurrentTab(gate);
                setQuestionIdx(0);
                setSelectedAns(null);
                setIsCorrect(null);
                setStreak(0);
                setPasses(0);
                setScore(0);
                setShowExplain(false);
                setGameCompleted(false);
            };

            const handleAnswer = (option) => {
                if (selectedAns !== null) return; // Prevent double clicking

                setSelectedAns(option);
                const correct = option === activeQuestion.ans;
                setIsCorrect(correct);
                setShowExplain(true);

                if (correct) {
                    playSound('success');
                    const newStreak = streak + 1;
                    setStreak(newStreak);
                    setScore(score + 10);
                    
                    // Award Transit Pass every 5 straight correct answers
                    if (newStreak % 5 === 0) {
                        setPasses(prev => prev + 1);
                        triggerConfetti();
                    }
                } else {
                    playSound('fail');
                    setStreak(0);
                }
            };

            const handleNext = () => {
                playSound('click');
                setSelectedAns(null);
                setIsCorrect(null);
                setShowExplain(false);

                if (questionIdx < activeQuestions.length - 1) {
                    setQuestionIdx(prev => prev + 1);
                } else {
                    // Completed the Gate!
                    setGameCompleted(true);
                    playSound('win');
                    triggerConfetti();
                }
            };

            const handleRestart = () => {
                selectGate(currentTab);
            };

            return (
                <div class="flex-1 flex flex-col justify-between max-w-6xl w-full mx-auto p-3 sm:p-6">

                    {/* Navbar */}
                    <header class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6 bg-white/80 backdrop-blur-md px-6 py-4 rounded-2xl shadow-md border-b-4 border-emerald-400">
                        <div class="flex items-center gap-3 cursor-pointer" onClick={() => selectGate('home')}>
                            <div class="w-12 h-12 bg-gradient-to-tr from-emerald-500 to-green-300 rounded-xl flex items-center justify-center shadow-lg text-white font-black text-2xl">
                                🍕
                            </div>
                            <div>
                                <h1 class="text-xl sm:text-2xl font-black text-emerald-800 tracking-tight leading-none">BIỆT ĐỘI PHÂN SỐ</h1>
                                <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">Hành Trình Vương Quốc Toán Học</span>
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-2 items-center">
                            <button 
                                onClick={() => selectGate('home')}

                            >
                                🏠 Trang Chủ
                            </button>
                            <button 
                                onClick={() => selectGate('teacher')}
                                class={`px-4 py-2 rounded-xl text-sm font-extrabold transition-all duration-300 ${currentTab === 'teacher' ? 'bg-purple-600 text-white shadow-md' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'}`}
                            >
                                👩‍🏫 Góc Giáo Viên
                            </button>
                        </div>
                    </header>

                    {/* Main Workspace Area */}
                    <main class="flex-1 flex flex-col justify-center">

                        {/* --- LANDING PAGE --- */}
                        {currentTab === 'home' && (
                            <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-center bg-white/90 p-6 sm:p-10 rounded-3xl shadow-xl border-4 border-emerald-100">

                                        Đồng hành cùng bạn <span class="text-emerald-600 font-extrabold">Nam</span> và bạn <span class="text-amber-500 font-extrabold">Robot</span> tinh nghịch giải cứu Vương quốc Pizza tươi đẹp và chinh phục Khu vườn sinh thái đầy kỳ thú!
                                    </p>

                                    {/* Gate Cards Selection */}
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4">
                                        {/* Gate 1 Card */}
                                        <div 
                                            onClick={() => selectGate('gate1')}
                                            class="group cursor-pointer bg-gradient-to-b from-amber-50 to-orange-100/50 p-5 rounded-2xl border-4 border-amber-300 shadow-md hover:shadow-xl hover:border-orange-400 transition-all duration-300 transform hover:-translate-y-1"
                                        >
                                            <div class="flex items-center justify-between mb-3">
                                                <span class="text-3xl group-hover:scale-110 transition-transform">🍕</span>
                                                <span class="bg-amber-600 text-white text-[10px] font-black uppercase px-2.5 py-1 rounded-full">Cửa 1</span>
                                            </div>
                                            <h3 class="text-lg font-black text-amber-800 mb-1">Mẫu Số Đồng Nhất</h3>
                                            <p class="text-xs text-amber-700/80 font-bold mb-3">20 Thử thách trừ phân số cùng mẫu & các câu đố chia Pizza vui nhộn.</p>
                                            <span class="text-xs font-black text-orange-600 group-hover:underline">Bắt đầu ngay →</span>
                                        </div>

                                        {/* Gate 2 Card */}
                                        <div 
                                            onClick={() => selectGate('gate2')}
                                            class="group cursor-pointer bg-gradient-to-b from-emerald-50 to-teal-100/50 p-5 rounded-2xl border-4 border-emerald-300 shadow-md hover:shadow-xl hover:border-emerald-400 transition-all duration-300 transform hover:-translate-y-1"
                                        >
                                            <div class="flex items-center justify-between mb-3">
                                                <span class="text-3xl group-hover:scale-110 transition-transform">🌳</span>
                                                <span class="bg-emerald-600 text-white text-[10px] font-black uppercase px-2.5 py-1 rounded-full">Cửa 2</span>
                                            </div>
                                            <h3 class="text-lg font-black text-emerald-800 mb-1">Quy Đồng Mẫu Số</h3>
                                            <p class="text-xs text-emerald-700/80 font-bold mb-3">20 Thử thách quy đồng mẫu số, so sánh sợi dây & giúp Sâu, Ếch cứu vườn.</p>
                                            <span class="text-xs font-black text-emerald-600 group-hover:underline">Bắt đầu ngay →</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Illustrator Column */}
                                <div class="md:col-span-5 flex flex-col items-center justify-center space-y-4">
                                    <div class="bg-gradient-to-tr from-emerald-100 to-amber-100 p-6 rounded-full shadow-inner animate-float relative">
                                        <span class="text-8xl">🤖</span>
                                        <span class="text-4xl absolute -top-2 -right-2">🎒</span>
                                        <span class="text-4xl absolute -bottom-2 -left-2">🧁</span>
                                    </div>
                                    <div class="text-center">
                                        <p class="font-extrabold text-slate-700">"Chào bạn! Tớ là Robot."</p>
                                        <p class="text-xs text-slate-500 font-bold max-w-xs mt-1">Sẵn sàng cùng tớ giải quyết những mẫu số bướng bỉnh chưa nào?</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* --- INTERACTIVE GAME SCREEN --- */}
                        {(currentTab === 'gate1' || currentTab === 'gate2') && !gameCompleted && (
                            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                                
                                {/* Left Side: Question and visualizer */}
                                <div class="lg:col-span-7 bg-white/95 p-5 sm:p-7 rounded-3xl shadow-lg border-4 border-emerald-300 space-y-6">
                                    {/* Stat line */}
                                    <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-slate-100 pb-4">
                                        <span class="bg-slate-100 text-slate-700 font-extrabold text-xs px-3 py-1.5 rounded-xl">
                                            Câu {questionIdx + 1} / {activeQuestions.length}
                                        </span>
                                        <div class="flex gap-3">
                                            <span class="bg-amber-100 text-amber-800 font-extrabold text-xs px-3 py-1.5 rounded-xl flex items-center gap-1">
                                                🔥 Chuỗi: {streak}
                                            </span>
                                            <span class="bg-purple-100 text-purple-800 font-extrabold text-xs px-3 py-1.5 rounded-xl flex items-center gap-1">
                                                🎟️ Vé thông hành: {passes}
                                            </span>
                                            <span class="bg-emerald-100 text-emerald-800 font-extrabold text-xs px-3 py-1.5 rounded-xl">
                                                ⭐ Điểm: {score}
                                            </span>
                                        </div>
                                    </div>

                                    {/* Visual Representation Area */}
                                    {currentTab === 'gate1' ? (
                                        activeQuestion.type === "calc" ? <PizzaVisualizer question={activeQuestion} /> : null
                                    ) : (
                                        <GardenVisualizer questionIndex={questionIdx} totalQuestions={activeQuestions.length} />
                                    )}

                                    {/* Question Card */}
                                    <div class="space-y-4">
                                        {activeQuestion.type === "word" && (
                                            <div class="bg-sky-50 border-2 border-sky-200 text-sky-900 p-4 rounded-2xl font-bold text-sm leading-relaxed shadow-sm">
                                                📝 <span class="font-black text-xs uppercase text-sky-600 block mb-1">Bài toán thực tế:</span>
                                                {activeQuestion.q}
                                            </div>
                                        )}

                                        <div class="text-center p-4 bg-slate-50 border border-slate-200 rounded-2xl">
                                            <span class="font-extrabold text-slate-500 text-xs block uppercase tracking-wider mb-2">Thực hiện phép tính</span>
                                            <div class="flex items-center justify-center flex-wrap gap-2 text-3xl font-black">
                                                {activeQuestion.type === "calc" ? (
                                                    <>
                                                        <RenderFraction fractionStr={activeQuestion.q.split('-')[0]} />
                                                        <span class="text-red-500 font-bold mx-2">-</span>
                                                        <RenderFraction fractionStr={activeQuestion.q.split('-')[1]} />
                                                        <span class="text-slate-400 font-bold mx-2">=</span>
                                                        <span class="text-emerald-500 bg-emerald-50 px-3 py-1.5 border-2 border-dashed border-emerald-400 rounded-xl animate-pulse">?</span>
                                                    </>
                                                ) : (
                                                    <span class="text-lg sm:text-xl font-black text-slate-800 text-center">Hãy chọn đáp án đúng cho bài toán đố bên trên!</span>
                                                )}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Options Selection */}
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                                        {activeQuestion.options.map((opt, i) => {
                                            const isSelected = selectedAns === opt;
                                            const isCorrectAns = opt === activeQuestion.ans;
                                            let btnStyle = "bg-white border-slate-200 hover:border-emerald-400 text-slate-700 hover:bg-emerald-50/50";
                                            
                                            if (selectedAns !== null) {
                                                if (isCorrectAns) {
                                                    btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-800 scale-102 font-black";
                                                } else if (isSelected) {
                                                    btnStyle = "bg-rose-100 border-rose-500 text-rose-800";
                                                } else {
                                                    btnStyle = "bg-white border-slate-200 text-slate-400 opacity-60";
                                                }
                                            }

                                            return (
                                                <button
                                                    key={i}
                                                    disabled={selectedAns !== null}
                                                    onClick={() => handleAnswer(opt)}
                                                    class={`p-4 border-2 rounded-2xl text-lg font-bold transition-all duration-300 shadow-sm flex items-center justify-center gap-2 ${btnStyle}`}
                                                >
                                                    <span class="text-xs text-slate-400 bg-slate-100 w-6 h-6 rounded-full flex items-center justify-center font-bold">
                                                        {String.fromCharCode(65 + i)}
                                                    </span>
                                                    <RenderFraction fractionStr={opt} />
                                                    {selectedAns !== null && isCorrectAns && <span class="text-emerald-600 text-xl">✅</span>}
                                                    {selectedAns !== null && isSelected && !isCorrectAns && <span class="text-rose-600 text-xl">❌</span>}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Right Side: Explanation and mascot feedback */}
                                <div class="lg:col-span-5 flex flex-col gap-4">
                                    
                                    {/* Mascot Advice Balloon */}
                                    <div class="bg-white/95 p-5 rounded-3xl shadow-lg border-4 border-amber-300 flex items-start gap-4">
                                        <div class="text-4xl">🤖</div>
                                        <div class="space-y-1">
                                            <h4 class="font-extrabold text-amber-800 text-sm">Gợi ý của Robot:</h4>
                                            <p class="text-xs text-slate-600 font-bold leading-relaxed">
                                                {currentTab === 'gate1' 
                                                    ? "Muốn trừ hai phân số cùng mẫu số, ta trừ tử số của phân số thứ nhất cho tử số của phân số thứ hai và giữ nguyên mẫu số nhé!"
                                                    : "Để thực hiện phép tính này, trước tiên ta cần quy đồng mẫu số của chúng về cùng một mẫu số chung đấy!"
                                                }
                                            </p>
                                        </div>
                                    </div>

                                    {/* Verification Card (Visible after answering) */}
                                    {showExplain && (
                                        <div class={`p-5 rounded-3xl shadow-lg border-4 transition-all duration-300 ${isCorrect ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-rose-50 border-rose-300 text-rose-900'}`}>
                                            <div class="flex items-center gap-2 mb-2">
                                                <span class="text-2xl">{isCorrect ? '🎉' : '💡'}</span>
                                                <h4 class="font-black text-base">{isCorrect ? 'Tuyệt vời! Đáp án chính xác!' : 'Chưa đúng rồi! Hãy xem lời giải nhé:'}</h4>
                                            </div>
                                            
                                            <p class="text-xs font-bold leading-relaxed mb-4">
                                                {activeQuestion.explain}
                                            </p>

                                            {/* Streak milestones message */}
                                            {isCorrect && streak % 5 === 0 && (
                                                <div class="bg-amber-100 border border-amber-400 text-amber-800 p-2.5 rounded-xl text-xs font-black text-center mb-3 animate-bounce">
                                                    🎁 NHẬN ĐƯỢC 1 VÉ THÔNG HÀNH CHUYÊN NGHIỆP!
                                                </div>
                                            )}

                                            <button
                                                onClick={handleNext}
                                                class="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white font-extrabold rounded-2xl text-sm transition-all shadow-md active:translate-y-0.5"
                                            >
                                                {questionIdx < activeQuestions.length - 1 ? 'Câu Tiếp Theo ➔' : 'Xem Kết Quả Chung Cuộc ➔'}
                                            </button>
                                        </div>
                                    )}

                                </div>
                            </div>
                        )}

                        {/* --- GAME COMPLETED SCREEN --- */}
                        {gameCompleted && (
                            <div class="max-w-2xl mx-auto bg-white/95 p-8 rounded-3xl shadow-xl border-4 border-amber-400 text-center space-y-6">
                                <div class="text-6xl animate-float">🏆</div>
                                <h2 class="text-3xl font-black text-amber-800 tracking-tight">Cựu Chiến Binh Hoàn Thành Thử Thách!</h2>
                                <p class="text-slate-600 font-bold max-w-md mx-auto">
                                    Chúc mừng bạn đã xuất sắc vượt qua toàn bộ 20 thử thách phân số tại <span class="text-emerald-600 font-black">{currentTab === 'gate1' ? 'Cửa 1: Mẫu Số Đồng Nhất' : 'Cửa 2: Quy Đồng Mẫu Số'}</span>!
                                </p>

                                <div class="grid grid-cols-3 gap-3 bg-amber-50 p-4 rounded-2xl border-2 border-amber-200">
                                    <div>
                                        <span class="block text-2xl">⭐</span>
                                        <span class="block text-xs text-slate-500 font-bold mt-1">Tổng điểm</span>
                                        <span class="block text-lg font-black text-amber-700">{score}</span>
                                    </div>
                                    <div>
                                        <span class="block text-2xl">🎟️</span>
                                        <span class="block text-xs text-slate-500 font-bold mt-1">Vé thông hành</span>
                                        <span class="block text-lg font-black text-purple-700">{passes}</span>
                                    </div>
                                    <div>
                                        <span class="block text-2xl">🎯</span>
                                        <span class="block text-xs text-slate-500 font-bold mt-1">Chuỗi cao nhất</span>
                                        <span class="block text-lg font-black text-emerald-700">{streak}</span>
                                    </div>
                                </div>

                                <div class="flex flex-col sm:flex-row gap-3 justify-center pt-2">
                                    <button
                                        onClick={handleRestart}
                                        class="px-6 py-3 bg-amber-500 hover:bg-amber-600 text-white font-extrabold rounded-2xl text-sm shadow-md transition-all"
                                    >
                                        🔄 Chơi Lại Cửa Này
                                    </button>
                                    <button
                                        onClick={() => selectGate('home')}
                                        class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-2xl text-sm shadow-md transition-all"
                                    >
                                        🏠 Chọn Cửa Khác
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* --- TEACHER / CLASS CORNER --- */}
                        {currentTab === 'teacher' && (
                            <div class="bg-white/95 p-6 sm:p-8 rounded-3xl shadow-lg border-4 border-purple-400 space-y-6">
                                <div class="flex flex-col sm:flex-row items-center justify-between gap-4 border-b-2 border-slate-100 pb-4">
                                    <div>
                                        <h2 class="text-2xl font-black text-purple-800">👩‍🏫 Góc Giáo Viên & Trọng Tài</h2>
                                        <p class="text-xs text-slate-500 font-bold">In hoặc hiển thị đáp án trực tiếp để tổ chức trò chơi "Tiếp sức đồng đội" và "Giải cứu khu vườn" trên lớp.</p>
                                    </div>
                                    <button
                                        onClick={() => window.print()}
                                        class="bg-purple-100 hover:bg-purple-200 text-purple-700 font-black px-4 py-2 rounded-xl text-xs transition-all"
                                    >
                                        🖨️ In Danh Sách Câu Hỏi
                                    </button>
                                </div>

                                {/* Tips for teachers */}
                                <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-xl">
                                    <h3 class="font-extrabold text-amber-800 text-sm mb-1">💡 Hướng dẫn tổ chức trên lớp:</h3>
                                    <ul class="text-xs font-bold text-slate-700 space-y-1 list-disc list-inside">
                                        <li><span class="text-orange-600">Trò chơi "Tiếp sức đồng đội" (Dùng cho Cửa 1):</span> Chia lớp thành 2 - 3 đội. Mỗi học sinh trả lời đúng sẽ giúp đội tiến lên. Đạt được 5 câu đúng liên tiếp nhận được 1 "Vé thông hành" để mở khoá Cửa 2.</li>
                                        <li><span class="text-emerald-600">Trò chơi "Giải cứu khu vườn" (Dùng cho Cửa 2):</span> Học sinh trả lời đúng để giúp Sâu nhỏ leo tới lá xanh, hoặc giúp Ếch xanh nhảy qua đầm lầy an toàn.</li>
                                    </ul>
                                </div>

                                {/* Accordion / Tabs inside teacher menu */}
                                <div class="space-y-6">
                                    <div>
                                        <h3 class="text-lg font-black text-amber-700 mb-3">🍕 ĐÁP ÁN CỬA 1: THỬ THÁCH MẪU SỐ ĐỒNG NHẤT (20 Câu)</h3>
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-96 overflow-y-auto pr-2">
                                            {gate1Questions.map((q, idx) => (
                                                <div key={idx} class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                                                    <p class="font-extrabold text-slate-800 mb-1">
                                                        Câu {idx + 1}: {q.type === 'word' ? '[Toán đố]' : '[Tính]'} {q.q}
                                                    </p>
                                                    <p class="text-emerald-700 font-black">Đáp án đúng: {q.ans}</p>
                                                    <p class="text-slate-500 font-semibold mt-1">Lời giải: {q.explain}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <h3 class="text-lg font-black text-emerald-700 mb-3">🌳 ĐÁP ÁN CỬA 2: THỬ THÁCH QUY ĐỒNG MẪU SỐ (20 Câu)</h3>
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-96 overflow-y-auto pr-2">
                                            {gate2Questions.map((q, idx) => (
                                                <div key={idx} class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs">
                                                    <p class="font-extrabold text-slate-800 mb-1">
                                                        Câu {idx + 1}: {q.type === 'word' ? '[Toán đố]' : '[Tính]'} {q.q}
                                                    </p>
                                                    <p class="text-emerald-700 font-black">Đáp án đúng: {q.ans}</p>
                                                    <p class="text-slate-500 font-semibold mt-1">Lời giải: {q.explain}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Footer */}
                    <footer class="mt-8 text-center text-xs text-slate-400 font-bold border-t border-slate-200/50 pt-4 flex flex-col sm:flex-row items-center justify-between gap-2">
                        <span>Chương trình GDPT 2018 - Môn Toán Lớp 4 (Cánh Diều / Kết nối tri thức)</span>
                        <span class="bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full text-[10px] font-black uppercase">QUOCRAU AI SYSTEM V3.0</span>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
