<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HÀNH TRÌNH KHÁM PHÁ TOÁN HỌC 4</title>
    <style>
        :root {
            --primary: #4e54c8;
            --secondary: #8f94fb;
            --accent: #ff6b6b;
            --yellow: #feca57;
            --green: #1dd1a1;
            --dark: #2d3436;
            --light: #f7f9fc;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
            position: relative;
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(90deg, #4e54c8, #8f94fb);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .progress-container {
            width: 100%;
            background: #e0e0e0;
            height: 10px;
        }

        .progress-bar {
            height: 100%;
            background: var(--green);
            width: 0%;
            transition: width 0.3s ease;
        }

        .content {
            padding: 30px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .screen.active {
            display: flex;
        }

        .start-screen h2 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .start-screen p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
            max-width: 600px;
            line-height: 1.5;
        }

        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 107, 107, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(255, 107, 107, 0.6);
        }

        .question-badge {
            background: #eef2ff;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 12px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
            align-self: flex-start;
        }

        .question-text {
            font-size: 1.3rem;
            color: var(--dark);
            margin-bottom: 25px;
            font-weight: 600;
            line-height: 1.5;
            width: 100%;
            text-align: left;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 16px;
            padding: 18px 20px;
            font-size: 1.1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            font-weight: 500;
        }

        .option-btn:hover {
            border-color: var(--secondary);
            background: #f0f3ff;
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }

        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            width: 100%;
            text-align: left;
            font-weight: 500;
        }

        .feedback-box.correct {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .feedback-box.incorrect {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .next-btn {
            margin-top: 20px;
            align-self: flex-end;
            display: none;
            background: var(--primary);
        }

        .result-screen h2 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, #feca57, #ff6b6b);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 20px 0;
            box-shadow: 0 10px 20px rgba(254, 202, 87, 0.4);
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1>🎮 ÔN TẬP TOÁN 4 - ĐẦU NĂM HỌC</h1>
        <div class="stats-bar">
            <div class="stat-item">🏆 Điểm: <span id="score">0</span></div>
            <div class="stat-item">⭐ Câu: <span id="question-num">0</span>/10</div>
        </div>
    </div>
    
    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="content">
        <div class="screen start-screen active" id="start-screen">
            <h2>Chào mừng các em học sinh! 🚀</h2>
            <p>Hãy tham gia thử thách ôn tập kiến thức Ôn tập các số đến 100 000 và Bốn phép tính đầu năm Toán lớp 4 nhé. Chúc các em đạt điểm tối đa!</p>
            <button class="btn" onclick="startGame()">BẮT ĐẦU NGAY</button>
        </div>

        <div class="screen" id="question-screen">
            <div class="question-badge" id="q-category">Chủ đề</div>
            <div class="question-text" id="q-text">Nội dung câu hỏi...</div>
            
            <div class="options-grid" id="options-container"></div>

            <div class="feedback-box" id="feedback"></div>
            <button class="btn next-btn" id="next-btn" onclick="nextQuestion()">CÂU TIẾP THEO ➔</button>
        </div>

        <div class="screen result-screen" id="result-screen">
            <h2>HOÀN THÀNH THỬ THÁCH! 🎉</h2>
            <div class="score-circle" id="final-score">0</div>
            <p id="result-comment" style="font-size: 1.2rem; color: #555; margin-bottom: 25px;">Em làm tốt lắm!</p>
            <button class="btn" onclick="startGame()">CHƠI LẠI LẦN NỮA</button>
        </div>
    </div>
</div>

<script>
    const questions = [
        {
            category: "Chủ đề 1: Đọc & Viết số",
            text: "Số gồm '4 chục nghìn, 2 nghìn, 5 trăm và 3 chục' được viết là:",
            options: ["42 530", "42 503", "42 053", "40 253"],
            correct: 0,
            explain: "Số gồm 4 chục nghìn, 2 nghìn, 5 trăm, 3 chục, 0 đơn vị là 42 530."
        },
        {
            category: "Chủ đề 1: Phân tích cấu tạo số",
            text: "Số 86 209 được viết thành tổng các hàng là:",
            options: [
                "80 000 + 6 000 + 200 + 9",
                "80 000 + 6 000 + 20 + 9",
                "8 000 + 600 + 20 + 9",
                "80 000 + 600 + 200 + 9"
            ],
            correct: 0,
            explain: "86 209 = 80 000 + 6 000 + 200 + 9."
        },
        {
            category: "Chủ đề 1: So sánh số",
            text: "Tìm số bé nhất trong các số sau: 20 107, 19 482, 15 999, 18 700.",
            options: ["20 107", "19 482", "15 999", "18 700"],
            correct: 2,
            explain: "So sánh các số 5 chữ số ở hàng chục nghìn và hàng nghìn, số bé nhất là 15 999."
        },
        {
            category: "Chủ đề 1: Làm tròn số",
            text: "Số dân của một phường là 12 967 người. Làm tròn số dân này đến hàng nghìn ta được:",
            options: ["12 900", "13 000", "12 000", "12 960"],
            correct: 1,
            explain: "Hàng trăm là 9 (>=5) nên làm tròn lên thành 13 000."
        },
        {
            category: "Chủ đề 2: Tính nhẩm & Phép tính",
            text: "Kết quả của phép tính: 46 000 + 4 000 + 9 000 là bao nhiêu?",
            options: ["50 000", "59 000", "58 000", "49 000"],
            correct: 1,
            explain: "46 000 + 4 000 = 50 000; 50 000 + 9 000 = 59 000."
        },
        {
            category: "Chủ đề 2: Giá trị biểu thức",
            text: "Tính giá trị của biểu thức: 57 670 - (29 653 - 2 653)",
            options: ["30 670", "28 017", "25 670", "30 000"],
            correct: 0,
            explain: "Tính trong ngoặc trước: 29 653 - 2 653 = 27 000. Sau đó: 57 670 - 27 000 = 30 670."
        },
        {
            category: "Chủ đề 2: Đố em - Que tính",
            text: "Số 28 569 được xếp bằng que tính. Chuyển 1 que tính ở chữ số 8 để tạo thành số BÉ NHẤT, số đó là:",
            options: ["20 569", "26 569", "29 569", "23 569"],
            correct: 0,
            explain: "Di chuyển 1 que ở giữa số 8 để biến số 8 thành số 0, ta được số bé nhất là 20 569."
        },
        {
            category: "Chủ đề 2: Nhân, chia trong phạm vi 100 000",
            text: "Một xe ô tô chở 4 500 kg gạo. 4 xe như thế chở được bao nhiêu ki-lô-gam gạo?",
            options: ["18 000 kg", "16 000 kg", "20 000 kg", "18 500 kg"],
            correct: 0,
            explain: "4 500 x 4 = 18 000 kg."
        },
        {
            category: "Chủ đề 2: Phép chia có dư",
            text: "Thực hiện phép tính 54 658 : 9 được thương và số dư là:",
            options: [
                "Thương là 6 073 và số dư là 1",
                "Thương là 6 072 và số dư là 10",
                "Thương là 6 073 và số dư là 0",
                "Thương là 6 730 và số dư là 1"
            ],
            correct: 0,
            explain: "54 658 : 9 = 6 073 (dư 1)."
        },
        {
            category: "Chủ đề 2: Giải toán có lời văn",
            text: "Để phục vụ năm học mới, cửa hàng nhập về 4 050 quyển sách tham khảo. Số sách giáo khoa nhập về gấp 5 lần số sách tham khảo. Hỏi cửa hàng nhập tất cả bao nhiêu quyển sách?",
            options: ["20 250 quyển", "24 300 quyển", "16 200 quyển", "25 000 quyển"],
            correct: 1,
            explain: "Số SGK = 4 050 x 5 = 20 250. Tổng số sách = 4 050 + 20 250 = 24 300 quyển."
        }
    ];

    let currentQ = 0;
    let score = 0;

    function startGame() {
        currentQ = 0;
        score = 0;
        document.getElementById("start-screen").classList.remove("active");
        document.getElementById("result-screen").classList.remove("active");
        document.getElementById("question-screen").classList.add("active");
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentQ];
        document.getElementById("question-num").innerText = currentQ + 1;
        document.getElementById("score").innerText = score;
        document.getElementById("q-category").innerText = q.category;
        document.getElementById("q-text").innerText = q.text;
        document.getElementById("progress-bar").style.width = ((currentQ) / questions.length) * 100 + "%";

        const optionsContainer = document.getElementById("options-container");
        const feedback = document.getElementById("feedback");
        const nextBtn = document.getElementById("next-btn");
        
        feedback.className = "feedback-box";
        feedback.style.display = "none";
        nextBtn.style.display = "none";
        optionsContainer.innerHTML = "";

        q.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerHTML = `<strong style="margin-right:10px;">${String.fromCharCode(65 + index)}.</strong> ${opt}`;
            btn.onclick = () => checkChoice(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function checkChoice(selectedIndex, btnElement) {
        const q = questions[currentQ];
        const allBtns = document.querySelectorAll(".option-btn");
        allBtns.forEach(btn => btn.style.pointerEvents = "none");

        const feedback = document.getElementById("feedback");

        if (selectedIndex === q.correct) {
            btnElement.classList.add("correct");
            score += 10;
            document.getElementById("score").innerText = score;
            feedback.innerHTML = "🎉 <b>Chính xác!</b> " + q.explain;
            feedback.className = "feedback-box correct";
        } else {
            btnElement.classList.add("incorrect");
            allBtns[q.correct].classList.add("correct");
            feedback.innerHTML = "❌ <b>Chưa đúng rồi!</b> " + q.explain;
            feedback.className = "feedback-box incorrect";
        }

        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById("question-screen").classList.remove("active");
        document.getElementById("result-screen").classList.add("active");
        document.getElementById("progress-bar").style.width = "100%";

        document.getElementById("final-score").innerText = score + "đ";

        let comment = "";
        if (score === 100) {
            comment = "🌟 Tuyệt vời! Em đạt điểm tối đa, kiến thức rất vững vàng!";
        } else if (score >= 70) {
            comment = "👍 Rất tốt! Em đã nắm chắc hầu hết các kiến thức ôn tập đầu năm.";
        } else {
            comment = "💪 Cố gắng lên nhé! Em hãy rèn luyện thêm các bài tập về tính toán nhé.";
        }
        document.getElementById("result-comment").innerText = comment;
    }
</script>
</body>
</html>
